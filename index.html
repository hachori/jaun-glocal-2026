/* 진행 막대: 장마다 한 칸 */
const order = []; SLIDES.forEach(s => { if (!order.includes(s.ch)) order.push(s.ch); });
const chCount = Object.fromEntries(order.map(c => [c, SLIDES.filter(s => s.ch === c).length]));
$('#prog').innerHTML = order.map(c => `<i style="flex:${chCount[c]};--pc:${CH_COLOR[c]}" data-ch="${c}"><b></b></i>`).join('');

/* 쪽 목록 */
$('#ovg').innerHTML = order.map(c => `<div class="grp">${CH[c].no ? CH[c].no + ' · ' : ''}${CH[c].name}</div><div class="grid">${SLIDES.map((s, i) => s.ch === c ? `<button class="ch-${c}" data-i="${i}"><span>${i + 1}</span>${s.title}</button>` : '').join('')}</div>`).join('');
$$('#ov button').forEach(b => b.onclick = () => { show(+b.dataset.i); });

/* 상태 */
let cur = 0, step = 0, T0 = null, presWin = null;
const maxStep = (el, s) => {
  let m = 0;
  $$('[data-step]', el).forEach(e => { m = Math.max(m, +e.dataset.step); });
  if (s.focus) m = Math.max(m, s.focus.from + s.focus.n);
  return m;
};

/* 숫자 올라가기 */
function countUps(el) {
  $$('[data-count]', el).forEach(n => {
    if (n.dataset.done) return;
    const host = n.closest('[data-step]');
    if (host && !host.classList.contains('shown')) return;
    n.dataset.done = 1;
    const to = +n.dataset.count, dec = +(n.dataset.dec || 0);
    if (ST) { n.textContent = to.toFixed(dec); return; }
    const delayHost = n.closest('[data-d]'); const delay = delayHost ? +delayHost.dataset.d : 0;
    const t0 = performance.now() + delay, dur = 1100;
    n.textContent = (0).toFixed(dec);
    const tick = t => { const p = Math.min(1, Math.max(0, (t - t0) / dur)); const e = 1 - Math.pow(1 - p, 3); n.textContent = (to * e).toFixed(dec); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

function setReflectionVisible(el, layer, open) {
  if (open === !layer.hidden) return;
  const transferFocus = open && el.contains(document.activeElement);
  layer.hidden = !open;
  layer.classList.toggle('shown', open);
  for (const sibling of el.children) {
    if (sibling === layer) continue;
    if (open && !sibling.inert) {
      sibling.dataset.reflectionInert = '';
      sibling.inert = true;
    } else if (!open && sibling.hasAttribute('data-reflection-inert')) {
      delete sibling.dataset.reflectionInert;
      sibling.inert = false;
    }
  }
  if (transferFocus) layer.focus({preventScroll:true});
}
function applyStep(el, s, n, overview = overviewMode) {
  $$('[data-step]', el).forEach(e => {
    const start = Number(e.dataset.step);
    e.classList.toggle('shown', e.hasAttribute('data-step-only') ? n === start : n >= start);
  });
  const reflection = $('.reflection-overlay', el);
  if (reflection) {
    const page = $(`.reflection-stack[data-step="${n}"]`, reflection);
    const stacks = $$('.reflection-stack', reflection);
    for (const stack of stacks) stack.hidden = stack !== page;
    const progress = $('.reflection-progress', reflection);
    if (progress && page) progress.textContent = (stacks.indexOf(page) + 1) + ' / ' + stacks.length;
    setReflectionVisible(el, reflection, !overview && !!page);
  }
  if (s.focus) {
    const k = n - s.focus.from + 1, on = !overview && k >= 1 && k <= s.focus.n;
    $$('.fg', el).forEach(g => {
      g.classList.toggle('focusing', on);
      $$('[data-fi]', g).forEach(x => x.classList.toggle('now', on && +x.dataset.fi === k));
    });
  }
  const h = HOOKS[s.type]; if (h && h.step) h.step(el, s, n);
  countUps(el);
  updateHud();
}

function build(el) {
  el.classList.add('nt'); el.classList.remove('built');
  $$('[data-d]', el).forEach(e => { e.style.transitionDelay = e.dataset.d + 'ms'; });
  $$('[data-count]', el).forEach(n => { delete n.dataset.done; });
  void el.offsetWidth; el.classList.remove('nt');
  if (ST) { el.classList.add('built'); return; }
  /* 템플릿의 kick: 화면 그리기 신호가 멈춰 있어도(창이 가려진 경우 등) 시간으로 한 번 더 보장 */
  let done = false; const go = () => { if (!done) { done = true; el.classList.add('built'); } };
  requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(go, 80);
  clearTimeout(el._t);
  el._t = setTimeout(() => { $$('[data-d]', el).forEach(e => { e.style.transitionDelay = ''; }); if (!el._seen) { el._seen = 1; $$('.hot', el).forEach(h => { h.classList.remove('ring'); void h.offsetWidth; h.classList.add('ring'); }); } }, 3600);
}

function show(n, o = {}) {
  if (gallery.active) gallery.close(false);
  if (film.active) film.reset();
  closeCardModal(false);
  n = Math.max(0, Math.min(PG.length - 1, n));
  closeDrawer(); closeOv();
  const a = PG[cur], b = PG[n], sa = SLIDES[cur], sb = SLIDES[n];
  if (a !== b) {
    const reflection = $('.reflection-overlay', a);
    if (reflection) setReflectionVisible(a, reflection, false);
    const ha = HOOKS[sa.type]; if (ha && ha.leave) ha.leave(a, sa);
    const fromCard = Boolean(o.from && !ST);
    a.classList.remove('arriving-card');
    b.classList.remove('leaving-card');
    a.classList.toggle('leaving-card', fromCard);
    b.classList.toggle('arriving-card', fromCard);
    if (fromCard) {
      const r = o.from.getBoundingClientRect(), S = stage.getBoundingClientRect(), k = S.width / 1920;
      const og = `${(r.left + r.width / 2 - S.left) / k}px ${(r.top + r.height / 2 - S.top) / k}px`;
      a.style.transformOrigin = b.style.transformOrigin = og;
    } else a.style.transformOrigin = b.style.transformOrigin = '';
    a.classList.remove('on', 'built');
  }
  b.classList.add('on');
  cur = n;
  if (sb.id === 'opening' && T0 === null) T0 = Date.now();   /* 결과 보고 시작 = 타이머 시작 */
  build(b);
  // 정지 미리보기만 완성 화면으로 연다. 모션 줄이기에서도 질문과 소감문의 발표 순서는 보존한다.
  const manual = b.classList.contains('introduction') || sb.id === 'history' || sb.id === 'question' || sb.type === 'lessonSharing' || Object.hasOwn(REFLECTION_TITLES, sb.id);
  const defaultEnd = overviewMode || (ST && !manual);
  step = o.atEnd || defaultEnd ? maxStep(b, sb) : 0;
  const hb = HOOKS[sb.type]; if (hb && hb.enter) hb.enter(b, sb, step);
  applyStep(b, sb, step);
  history.replaceState(null, '', '#' + (n + 1) + (overviewMode ? '-static' : '') + (document.body.classList.contains('clean') ? '-clean' : ''));
}

function next() {
  if (gallery.active) { gallery.handleKey('ArrowRight'); return; }
  if (film.active && !film.playsStep) return;
  const s = SLIDES[cur], el = PG[cur], m = maxStep(el, s);
  const h = HOOKS[s.type]; if (h && h.next && h.next(el, s, step) === false) return;
  if (step < m) { step++; applyStep(el, s, step); }
  else if (cur < PG.length - 1) show(cur + 1);
}
function prev() {
  if (gallery.active) { gallery.handleKey('ArrowLeft'); return; }
  if (film.active && !film.playsStep) return;
  const s = SLIDES[cur], el = PG[cur];
  if (step > 0) { step--; applyStep(el, s, step); }
  else if (cur > 0) show(cur - 1, {atEnd: true});

/* 진행 표시·발표자 창 */
function updateHud() {
  const s = SLIDES[cur], m = maxStep(PG[cur], s);
  stage.classList.toggle('isdark', PG[cur].classList.contains('dark'));

function sendState() {
  if (presWin && !presWin.closed) presWin.postMessage({t: 'state', cur, step, max: maxStep(PG[cur], SLIDES[cur]), galleryOpen: gallery.active, T0}, '*');
}
function openPresenter() {
  presWin = window.open(location.href.split('#')[0] + '#presenter', 'deck-presenter', 'width=1280,height=820');
  setTimeout(sendState, 800);
}

/* 근거 서랍 */
function closeDrawer() { stage.classList.remove('dr-open'); }
function closeOv() { stage.classList.remove('ov-open'); }
$('#scrim').onclick = closeDrawer;

function playKids(restart = false) {
  const el = PG[cur], last = lastKidsStep;   /* 마지막 기준일 단계 */
  if (!restart && step < last) { next(); return; }
  setStep(1);
  /* 첫 구간이 끝나면 다음 구간을 이어서, 마지막 기준일에서 멈춤 */
  const chain = () => {
    if (PG[cur] !== el || step >= last) return;
    setStep(step + 1);
    KidsMotion.step(el, step, chain);
  };
  KidsMotion.replay(el, chain);
}

function setStep(n) {
  step = n;
  applyStep(PG[cur], SLIDES[cur], step);
}

/* 클릭: 이동(확대 전환)·서랍·보기 전환 */
stage.addEventListener('click', e => {
  if (gallery.active) return;
  if (!overviewMode && e.target.closest('.slide.on.introduction') && !stage.matches('.ov-open,.dr-open,.blackout')) {
    next();
    return;
  }
  if (e.target.id === 'card-modal' || e.target.closest('.card-modal-close')) { closeCardModal(); return; }
  if (e.target.closest('.card-modal-switch')) { showFullCardForm($('#card-modal-full').hidden); return; }
  const cardButton = e.target.closest('.card-enlarge');
  if (cardButton && cardButton.closest('.slide') === PG[cur]) { openCardModal(cardButton); return; }
  const agencyChoice = e.target.closest('[data-agency-step]');
  if (agencyChoice && !ST && agencyChoice.closest('.slide') === PG[cur]) {
    step = Number(agencyChoice.dataset.agencyStep);
    applyStep(PG[cur], SLIDES[cur], step);
    return;
  }
  const filmButton = e.target.closest('.film-trigger');
  if (filmButton && filmButton.closest('.slide') === PG[cur]) {
    if (SLIDES[cur].type === 'speech') setStep(1);
    else film.open(filmButton);
    return;
  }
  const galleryButton = e.target.closest('button[data-photo-gallery],button[data-photo-zoom]');
  if (galleryButton) {
    const page = PG[cur], summary = $('.pop.shown', page);
    if (galleryButton.closest('.slide') === page &&
        !film.active && !galleryButton.closest('[inert],[hidden]') &&
        !stage.matches('.ov-open,.dr-open,.blackout') && !summary?.getClientRects().length) {
      const photo = galleryButton.hasAttribute('data-photo-zoom') && $('img', galleryButton);
      const album = photo
        ? {title:galleryButton.dataset.photoZoom, detailOnly:true, photos:[{src:photo.currentSrc || photo.src, caption:photo.alt}]}
        : galleryAlbumForSlide(SLIDES[cur].id, galleryButton.dataset.photoGallery);
      if (album) gallery.open(album, galleryButton);
    }

  }

  if (go && IDX[go.dataset.go] != null && !stage.classList.contains('ov-open')) { show(IDX[go.dataset.go], {from: go}); return; }
  const button = e.target.closest('button');
  if (!button || button.closest('.slide') !== PG[cur] || button.closest('[hidden]')) return;

    KidsMotion.enter(PG[cur], date, ST);
    setStep(date);
  }
  else if (button.hasAttribute('data-kids-play')) playKids();
});

/* 키보드(프레젠터 리모컨 호환) — 발표자 창에서 보낸 키도 같은 길로 */
function handleKey(k, e) {
  if (gallery.active) {
    // 로컬 Enter/Space는 사진·닫기 등 초점이 있는 버튼의 기본 동작에 맡긴다.
    const key = !e && (k === ' ' || k === 'Enter') ? 'ArrowRight' : k;
    if (gallery.handleKey(key)) e?.preventDefault();
    return;
  }
  if (!$('#card-modal').hidden) {
    if (k === 'Escape') { e?.preventDefault(); closeCardModal(); }
    else if (k === 'Tab' && e) {
      const buttons = $$('#card-modal button');
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    else if ((k === 'Enter' || k === ' ') && e?.target.closest?.('#card-modal button')) return;
    else if (NEXT.includes(k) || PREV.includes(k)) e?.preventDefault();
    return;
  }
  if (SLIDES[cur].type === 'kids' && CountryMotion.dialogOpen(PG[cur])) {
    if (k === 'Escape') { e?.preventDefault(); CountryMotion.closeDetails(PG[cur]); }
    return;
  }
  if (e?.target.closest?.('.slide.on.kids button') && (k === 'Enter' || k === ' ')) return;
  if (film.active) {
    const usingControl = e?.target.closest?.('input') || ([' ', 'Enter'].includes(k) && e?.target.closest?.('button'));
    if (film.playsStep && !usingControl && (NEXT.includes(k) || PREV.includes(k))) {
      e?.preventDefault();
      if (NEXT.includes(k)) next(); else prev();
    } else film.handleKey(k, e);
    return;
  }
  if (e && e.target.closest?.('.film-trigger,.agency-hit,.card-enlarge,[data-photo-gallery],[data-photo-zoom],[data-sharing-action]') && (k === 'Enter' || k === ' ')) return;
  if (k === 'Enter' && e?.target.closest?.('.slide.on a[href]')) return;
  const pd = () => e && e.preventDefault();
  if (SLIDES[cur].type === 'kids' && ['r','R','ㄱ'].includes(k) && !stage.matches('.dr-open,.ov-open,.blackout')) {
    pd(); if (!e?.repeat) playKids(true); return;
  }
  if (!ST && SLIDES[cur].type === 'agency' && step > 0 && step <= SLIDES[cur].focus.n && !stage.matches('.dr-open,.ov-open,.blackout')) {
    if (k === 'Escape') { pd(); step = 0; applyStep(PG[cur], SLIDES[cur], step); return; }
    if (k === 'Tab') { pd(); $('.agency-cue', PG[cur]).focus({preventScroll:true}); return; }
  }
  if (NEXT.includes(k)) { pd(); if (stage.classList.contains('blackout')) { stage.classList.remove('blackout'); return; } next(); }
  else if (PREV.includes(k)) { pd(); prev(); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(PG.length - 1);
  else if ('oOㅐ'.includes(k)) stage.classList.toggle('ov-open');
  else if ('pPㅔ'.includes(k)) openPresenter();
  else if ('tTㅅ'.includes(k)) { T0 = Date.now(); updateHud(); }
  else if ('bBㅠ.'.includes(k)) stage.classList.toggle('blackout');
  else if ('fFㄹ'.includes(k)) { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if (k === 'F5') pd();
  else if (k === 'Escape') { if (stage.classList.contains('dr-open')) closeDrawer(); else if (stage.classList.contains('ov-open')) closeOv(); else stage.classList.remove('blackout'); }
}
addEventListener('keydown', e => { if (e.key.length === 1 && (e.ctrlKey || e.altKey || e.metaKey)) return; handleKey(e.key, e); });
addEventListener('hashchange', () => { if (/presenter/.test(location.hash)) location.reload(); });
addEventListener('message', e => {
  const d = e.data || {};
  if (!presWin && d.t === 'hello' && e.source?.opener === window) presWin = e.source;
  if (!presWin || e.source !== presWin) return;
  if (d.t === 'key') handleKey(d.k);
  else if (d.t === 'hello') sendState();
  else if (d.t === 'go') show(+d.i);
});

/* 장면별 동작 */
window.HOOKS = window.HOOKS || {};
let sharingTimeout;
function setSharingStep(el, stageNumber, moveFocus) {
  const discussion = $('.sharing-discussion', el);
  const open = stageNumber === 2;
  const transferFocus = moveFocus && el.contains(document.activeElement);
  const activeAction = stageNumber === 0 ? 'teachers' : 'discussion';
  const activeButton = $(`[data-sharing-action="${activeAction}"]`, el);
  for (const button of $$('.sharing-parts button', el)) {
    button.setAttribute('aria-pressed', String(button === activeButton));
  }
  $('.sharing-controls', el).hidden = !open;
  $('.teacher-sharing', el).hidden = open;
  discussion.hidden = !open;
  const screen = $('.sharing-screen', discussion);
  const status = $('.sharing-status', el);
  if (open && !screen.firstElementChild) {
    const frame = document.createElement('iframe');
    frame.title = '참관노트 협의회 실시간 공유 화면';
    frame.referrerPolicy = 'no-referrer';
    frame.src = $('.sharing-original', el).href;
    status.textContent = '협의회 화면을 불러오는 중…';
    function offerNewTab(message) {
      if (screen.firstElementChild !== frame) return;
      clearTimeout(sharingTimeout);
      status.textContent = message;
      $('.sharing-controls', el).classList.add('sharing-fallback');
    }
    // 외부 사이트의 load 이벤트만으로 실제 내용이 보이는지 확인할 수 없다.
    frame.addEventListener('load', () => {
      if (screen.firstElementChild !== frame || frame.dataset.failed) return;
      clearTimeout(sharingTimeout);
      status.textContent = '화면이 보이지 않으면';
    }, {once:true});
    frame.addEventListener('error', () => {
      frame.dataset.failed = 'true';
      offerNewTab('연결하지 못했습니다.');
    }, {once:true});
    sharingTimeout = setTimeout(() => offerNewTab('화면이 아직 보이지 않으면'), 5000);
    screen.appendChild(frame);
  } else if (!open) {
    clearTimeout(sharingTimeout);
    status.textContent = '';
    $('.sharing-controls', el).classList.remove('sharing-fallback');
    screen.replaceChildren();
  }
  if (transferFocus) activeButton.focus({preventScroll:true});
}
HOOKS.lessonSharing = {
  step(el, s, n) { setSharingStep(el, overviewMode ? 0 : n, true); },
  leave(el) { setSharingStep(el, 0, false); }
};
function resetAgencySpot(el) {
  el._agencyMotion?.cancel();
  el._agencyMotion = null;
  el._agencyOrigin = null;
  const spot = $('.agency-spot', el);
  spot.hidden = true;
  spot.classList.remove('visible');
  $('.agency-body', el).inert = false;
}
HOOKS.agency = {
  leave: resetAgencySpot,
  step(el, s, n) {
    if (ST) return;
    const button = $('.agency-hit[data-agency-step="' + n + '"]', el);
    const card = button?.closest('.el');
    const origin = card || el._agencyOrigin;
    if (!origin) return;
    el._agencyMotion?.cancel();
    const spot = $('.agency-spot', el), cue = $('.agency-cue', el);
    if (card) {
      el._agencyOrigin = card;
      cue.style.setProperty('--k', card.style.getPropertyValue('--k'));
      cue.style.setProperty('--kl', card.style.getPropertyValue('--kl'));
      $('.agency-pill', cue).textContent = $('.pg', card).textContent;
      const words = $('b', card).innerText.trim().split(/\s+/);
      const em = document.createElement('em');
      em.textContent = words.pop();
      $('h2', cue).replaceChildren(words.join(' ') + ' ', em);
      $('p', cue).textContent = $('p', card).textContent;
      spot.hidden = false;
      cue.focus({preventScroll:true});
      $('.agency-body', el).inert = true;
    }
    const source = origin.getBoundingClientRect(), target = cue.getBoundingClientRect();
    const scale = stage.getBoundingClientRect().width / 1920;
    const dx = (source.left + source.width / 2 - target.left - target.width / 2) / scale;
    const dy = (source.top + source.height / 2 - target.top - target.height / 2) / scale;
    const zoom = Math.min(source.width / target.width, source.height / target.height, .82);
    const atCard = {transform:`translate(${dx}px,${dy}px) scale(${zoom})`, opacity:card ? .24 : 0};
    const atCenter = {transform:'none', opacity:1};
    spot.classList.toggle('visible', !!card);
    const motion = cue.animate(card ? [atCard, atCenter] : [atCenter, atCard], {
      duration:card ? 540 : 300, easing:card ? 'cubic-bezier(.20,.74,.20,1)' : 'cubic-bezier(.4,0,.7,1)', fill:card ? 'none' : 'forwards'
    });
    el._agencyMotion = motion;
    if (!card) motion.onfinish = () => {
      if (el._agencyMotion !== motion) return;
      const restore = n === 0 && document.activeElement === cue;
      resetAgencySpot(el);
      if (restore) $('.agency-hit', origin).focus({preventScroll:true});
    };
  }
};
HOOKS.cover = {
  enter(el) { coverMotion.enter(el, ST); },
  leave(el) { coverMotion.leave(el); }
};
HOOKS.opening = {
  step(el, s, n) {
    const v = $('.bgv', el);
    v.onloadedmetadata = v.onended = null;
    $('.cap', el).disabled = n !== 0;
    el.classList.toggle('playing', n === 1);
    el.classList.toggle('arrived', n >= 2);
    if (n === 2) {
      v.pause();
      const showSchool = () => { v.currentTime = Math.max(0, v.duration - .05); };
      if (v.readyState >= 1) showSchool(); else v.onloadedmetadata = showSchool;
      return;
    }
    v.currentTime = 0;
    if (n === 0) { v.pause(); return; }
    v.muted = false;
    v.onended = () => { if (PG[cur] === el && step === 1) setStep(2); };
    // 퇴장 모션과 동시에 재생을 요청해 키·클릭의 사용자 동작으로 소리를 시작한다.
    v.play().catch(error => {
      if (error.name === 'NotAllowedError' && PG[cur] === el && step === 1) setStep(0);
    });
  },
  leave(el) {
    const v = $('.bgv', el);
    v.onloadedmetadata = v.onended = null;
    v.pause();
  },
};
/* 26쪽: 영상 단계에서 활동 영상과 같은 창을 열고, 정해진 구간 끝에서 기다린다. */
HOOKS.speech = {
  step(el, s, n) {
    if (n === 1 && !ST) film.open($('.film-trigger', el), CLIP, () => setStep(2));
    else if (film.playsStep) film.reset();
  }
};
/* 16쪽: 장 표지 → 방송 첫 화면 모음 → 재생할 수 있는 11월 필리핀 화면 */
HOOKS.greetIntro = {
  enter(el) { GreetVR.reset(el); },
  step(el, s, n) { GreetVR.step(el, n, ST); },
  leave(el) { GreetVR.stop(el); }
};
HOOKS.ending = {
  step(el, s, n) { el.classList.toggle('gather', n >= 1); }
};
/* 7쪽: 네 기준일 단계마다 반별 인원과 나라별 인원이 함께 바뀐다(통합안 11. 10.). */
HOOKS.kids = {
  enter(el, s, n) { KidsMotion.enter(el, n, ST); },
  step(el, s, n) { KidsMotion.step(el, n); },
  leave(el) { KidsMotion.leave(el); CountryMotion.closeDetails(el); }
};

/* 시작 */
const hm = H.match(/^#(\d+)/);
const start = hm ? +hm[1] - 1 : 0;
PG.forEach(p => p.classList.remove('on'));
cur = start; PG[cur].classList.add('on');
show(start);
window.__deck = {show, next, prev, get cur() { return cur; }, get step() { return step; }, count: PG.length, get T0() { return T0; }};

/* ===================== 발표자 창 (#presenter) — 지금 장면·단계, 경과 시간, 다음 장면 ===================== */
function renderPresenter() {
  document.body.className = 'pres-mode';
  document.body.innerHTML = `<div id="pv">
  <header><div class="pos"></div><div class="clock"><span class="tg">경과 시간</span><b class="el">–</b></div></header>
  <section class="cur"><div class="lab">지금 장면</div><div class="big"></div><div class="stp"></div></section>
  <footer><div class="nx"></div><div class="btns"><button data-k="ArrowLeft">← 이전</button><button data-k="t">타이머 다시</button><button data-k="ArrowRight">다음 →</button></div></footer>
  <div class="warn">발표 화면(index.html)에서 P 키를 눌러 이 창을 여세요. 이 창의 ← → 키와 버튼이 발표 화면을 넘깁니다.</div>
</div>`;
  let st = null;
  const op = window.opener;
  const send = m => { if (op && !op.closed) op.postMessage(m, '*'); };
  const clock = () => { if (st) $('#pv .el').textContent = st.T0 ? fmt((Date.now() - st.T0) / 1000) : '–'; };
  const draw = () => {
    if (!st) return;
    document.body.classList.add('linked');
    const s = SLIDES[st.cur], nx = SLIDES[st.cur + 1];
    $('#pv .pos').innerHTML = `<b>${st.cur + 1}</b> / ${SLIDES.length} · ${chName(s)}`;
    $('#pv .big').textContent = s.title;
    $('#pv .stp').textContent = (st.max ? `단계 ${st.step} / ${st.max}` : '단계 없음') + (st.galleryOpen ? ' · 사진 모음 (Esc: 돌아가기)' : '');
    $('#pv .nx').innerHTML = st.step < st.max ? `<span>다음</span><b>이 장면의 다음 단계</b>` : nx ? `<span>다음 장면</span><b>${st.cur + 2}. ${nx.title}</b>` : '<span>마지막 장면</span>';
    clock();
  };
  addEventListener('message', e => { const d = e.data || {}; if (op && e.source === op && d.t === 'state') { st = d; draw(); } });
  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'Escape' || [...NEXT, ...PREV].includes(k)) { e.preventDefault(); send({t: 'key', k}); }
    else if (st && SLIDES[st.cur].type === 'kids' && ['r','R','ㄱ'].includes(k) && !e.repeat && !e.ctrlKey && !e.altKey && !e.metaKey) send({t: 'key', k: 'r'});
    else if ('tTㅅ'.includes(k)) send({t: 'key', k: 't'});
    else if ('bBㅠ.'.includes(k)) send({t: 'key', k: 'b'});
  });
  $$('#pv [data-k]').forEach(b => b.onclick = () => send({t: 'key', k: b.dataset.k}));
  setInterval(clock, 500);
  send({t: 'hello'});
}
})();
</script>
