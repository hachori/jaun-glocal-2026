<style>/* ===== 자운초 종합 컨설팅 모션 덱 — 화면 문법 =====
   포스터의 색·구조 + 모션 템플릿의 움직임(순차 등장, 단계 강조, 확대 전환, 근거 서랍, 쪽 목록) */
:root{
  --navy:#26355E;--ink:#1E2533;--ink2:#3A4458;--mute:#6B7685;--line:#DCE3EC;--bg:#F3F6FA;--paper:#fff;
  --dodum:#2F75B8;--dodum-l:#E4EFFA;--chaeum:#26805A;--chaeum-l:#E2F3EA;--tium:#6A4CB5;--tium-l:#EEE9F9;
  --t1:#9C6210;--t1-l:#F6ECDB;--t3:#B04542;--t3-l:#F7E3E2;--sun:#FFD54A;--sun-l:#FFF6D6;--teal:#2A8068;
  --c:var(--navy);--c-l:#E6EAF3;
  --secondary-ink:#536174;
  --label-size:22px;
  --ez:cubic-bezier(.22,.68,.18,1);
  --f-title:'Sebang','A2Z','Malgun Gothic',sans-serif;
  --f-body:'A2Z','Segoe UI','Nirmala UI','Malgun Gothic',sans-serif;
  --f-kid:'Seoyun','A2Z','Malgun Gothic',sans-serif;
  --f-fun:'Jua','A2Z','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1020;overflow:hidden}
body{font-family:var(--f-body);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
img{display:block}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}

/* ----- 장 색 ----- */
.ch-open,.ch-pro,.ch-c1,.ch-c7,.ch-c8,.ch-end{--c:var(--navy);--c-l:#E6EAF3}
.ch-c2{--c:var(--t1);--c-l:var(--t1-l)}
.ch-c3{--c:var(--dodum);--c-l:var(--dodum-l)}
.ch-c4{--c:var(--chaeum);--c-l:var(--chaeum-l)}
.ch-c5{--c:var(--tium);--c-l:var(--tium-l)}
.ch-c6{--c:var(--t3);--c-l:var(--t3-l)}

/* ----- 장면(슬라이드) ----- */
.slide{position:absolute;inset:0;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s ease-out,visibility 0s .14s}
.slide.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .32s ease-out .06s}
.slide.leaving-card:not(.on){transform:scale(1.08);transition:opacity .12s ease-out,transform .16s ease-out,visibility 0s .14s}
.slide.arriving-card.on{animation:card-slide-arrive .43s var(--ez)}
@keyframes card-slide-arrive{
  0%,20%{opacity:0;transform:scale(.92)}
  100%{opacity:1;transform:scale(1)}
}
.slide.dark{background:#0E1424;color:#fff}
.slide .bgdeco{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(1200px 700px at 105% -10%,var(--c-l) 0,rgba(255,255,255,0) 60%),radial-gradient(900px 600px at -10% 110%,#fff 0,rgba(255,255,255,0) 60%)}

/* 순차 등장 */
.rv{opacity:0;transform:translateY(18px);transition:opacity .55s var(--ez),transform .8s var(--ez)}
.built .rv{opacity:1;transform:none}
.rv.l{transform:translateX(-28px)}.rv.r{transform:translateX(28px)}.rv.z{transform:scale(.92)}
.built .rv.l,.built .rv.r,.built .rv.z{transform:none}
/* 단계 공개 */
[data-step]{transition:opacity .5s var(--ez),transform .7s var(--ez)}
[data-step]:not(.shown){opacity:0!important;transform:translateY(18px);pointer-events:none}
/* 단계 강조(템플릿의 '한 단계씩 따라가기') */
.fg [data-fi]{transition:opacity .45s,transform .5s var(--ez),box-shadow .35s,border-color .35s}
.fg.focusing [data-fi]:not(.now){opacity:.26}
.fg [data-fi].now{transform:translateY(-8px);box-shadow:0 18px 40px rgba(20,30,60,.16),inset 0 6px 0 var(--c)!important;border-color:var(--c)!important}
.now-tag{position:absolute;left:-2px;top:-34px;background:var(--c);color:#fff;font:700 18px var(--f-body);padding:4px 14px;border-radius:10px 10px 0 0;display:none}
.fg [data-fi].now .now-tag{display:block}
/* 정적 모드·저사양 */
.nt *,.static *{transition:none!important;animation:none!important}

/* ----- 머리띠 ----- */
.hd{position:absolute;left:80px;right:80px;top:44px;height:60px;display:flex;align-items:center;gap:16px;z-index:3}
.chip-ch{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px 0 8px;border-radius:999px;background:var(--c);color:#fff;font:700 24px var(--f-body);white-space:nowrap}
.chip-ch .no{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font:800 22px var(--f-body)}
.hd .sub{font:600 var(--label-size) var(--f-body);color:var(--secondary-ink);white-space:nowrap}
.tabs{margin-left:auto;display:flex;gap:8px}
.tabs button{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--mute);font:600 20px var(--f-body);cursor:pointer;white-space:nowrap}
.tabs button.cur{background:var(--c);border-color:var(--c);color:#fff}
.tabs button:not(.cur):hover{border-color:var(--c);color:var(--c)}
.logo-sm{height:46px;width:auto;margin-left:14px}
.tabs+.logo-sm{margin-left:18px}
.hd .sp{margin-left:auto}

.ttl{position:absolute;left:80px;right:80px;top:132px;margin:0;font:400 54px/1.18 var(--f-title);letter-spacing:-.02em;color:var(--ink);z-index:2}
.ttl small{display:block;margin-top:12px;font:600 25px/1.3 var(--f-body);letter-spacing:0;color:var(--secondary-ink)}
.ttl em{font-style:normal;color:var(--c)}
.dark .ttl{color:#fff}.dark .ttl small{color:rgba(255,255,255,.7)}

/* ----- 공통 부품 ----- */
.card{position:absolute;background:#fff;border-radius:22px;border:1.5px solid var(--line);box-shadow:0 10px 26px rgba(20,30,60,.06)}
.ph{position:absolute;margin:0;border-radius:20px;overflow:hidden;background:#d9dfe8;box-shadow:0 14px 32px rgba(20,30,60,.16)}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 12s linear}
.on .ph img{transform:scale(1.1)}
.ph.still img,.on .ph.still img{transform:none;transition:none}
.ph figcaption{position:absolute;left:14px;bottom:14px;max-width:calc(100% - 28px);padding:7px 16px;border-radius:999px;background:rgba(14,20,36,.74);color:#fff;font:600 var(--label-size) var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.lowres::after{content:"저화질 · 원본 교체";position:absolute;right:10px;top:10px;padding:3px 10px;border-radius:8px;background:rgba(255,213,74,.95);color:#5a4500;font:700 14px var(--f-body)}
body.clean .ph.lowres::after{display:none}

.facts{position:absolute;display:flex;flex-direction:column;gap:14px}
.fact{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:6px;min-height:76px;padding:12px 22px;background:#fff;border:1.5px solid var(--line);border-radius:18px}
.fact b{font:700 20px var(--f-body);color:var(--c)}
.fact span{font:500 25px/1.4 var(--f-body);color:var(--ink)}
.fact span i{font-style:normal;color:var(--mute);font-size:21px}

.flow{position:absolute;display:flex;flex-direction:column;gap:10px}
.flow div{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border:1.5px solid var(--line);border-radius:16px;font:600 24px/1.35 var(--f-body)}
.flow div .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 18px var(--f-body)}

/* 사진이 있는 소감은 학생의 실제 손글씨를, 글만 받은 소감은 본문을 표시한다. */
@font-face{font-family:ReflectionHand;src:url('font/이서윤체.ttf') format('truetype');font-display:swap}
.reflection-overlay{
  position:absolute;inset:0;z-index:9;display:grid;place-items:center;outline:0;
  background:rgba(18,28,46,.63);backdrop-filter:blur(4px);
}
.reflection-overlay[hidden]{display:none}
.reflection-overlay.shown{animation:reflection-shade .27s ease-out both}
.reflection-content{width:1600px;display:grid;justify-items:center;gap:36px}
.reflection-content>h3{margin:0;color:white;text-align:center;font:700 44px/1.3 var(--f-body);text-shadow:0 2px 10px #101a2a66}
.reflection-progress{margin-left:12px;font:500 25px/1.3 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.reflection-stack{display:grid;gap:38px;width:100%;justify-items:center;align-items:stretch}
.reflection-stack[hidden]{display:none}
.reflection-stack:has(>:nth-child(3)){grid-template-columns:repeat(2,minmax(0,1fr))}
.reflection-bubble{
  --paper:#fffdf7;--offset:-46px;
  position:relative;display:grid;align-content:center;
  width:100%;max-width:1310px;min-height:180px;margin:0;padding:32px 48px 35px;
  border-radius:37px 37px 37px 12px;background:var(--paper);color:#202a3a;
  box-shadow:0 15px 38px rgba(10,20,33,.2);
  font:400 51px/1.28 'Seoyun',ReflectionHand,'Malgun Gothic',sans-serif;
  word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line;
}
.reflection-bubble>span{max-height:670px;overflow:auto;text-wrap:balance}
.reflection-bubble>footer{margin-top:12px;color:#445268;font:600 26px/1.25 var(--f-body);text-align:right}
.reflection-bubble:only-child{min-height:220px;padding:38px 78px}
.reflection-stack:has(>:nth-child(2):last-child) .reflection-bubble{max-width:1340px}
.reflection-stack:has(>:nth-child(2):last-child) .reflection-bubble:first-child{justify-self:start}
.reflection-stack:has(>:nth-child(2):last-child) .reflection-bubble:last-child{justify-self:end}
.reflection-stack:has(>:nth-child(2)) .reflection-bubble>span{max-height:300px}
.reflection-stack:has(>:nth-child(3)) .reflection-bubble{min-height:184px;font-size:46px}
.reflection-stack:has(>:nth-child(3):last-child) .reflection-bubble:last-child{grid-column:1/-1;max-width:calc(50% - 19px)}
.reflection-stack:has(>:nth-child(5)){grid-template-columns:repeat(6,minmax(0,1fr));column-gap:26px}
.reflection-stack:has(>:nth-child(5)) .reflection-bubble{grid-column:span 2;padding:26px 32px;font-size:42px}
.reflection-stack:has(>:nth-child(5)) .reflection-bubble:nth-child(4){grid-column:2/span 2}
.reflection-bubble:has(.reflection-handwriting){grid-template-columns:minmax(0,1fr);align-content:center;padding:24px 30px}
.reflection-handwriting{display:block;justify-self:center;width:100%;max-height:255px;object-fit:contain;mix-blend-mode:multiply}
.reflection-bubble:only-child .reflection-handwriting{max-width:1120px;max-height:500px}
.reflection-stack:has(>:nth-child(5)) .reflection-bubble:has(.reflection-handwriting){padding:18px 18px 22px}
.reflection-stack:has(>:nth-child(5)) .reflection-handwriting{max-height:248px}
.reflection-bubble::after{
  content:"";position:absolute;left:38px;bottom:-17px;width:31px;height:20px;
  background:var(--paper);clip-path:polygon(0 0,100% 0,10% 100%);
}
.reflection-bubble:nth-child(even){
  --paper:var(--c-l);--offset:46px;border-radius:37px 37px 12px 37px;
}
.reflection-bubble:nth-child(even)::after{left:auto;right:38px;transform:scaleX(-1)}
.reflection-overlay.shown .reflection-bubble{animation:reflection-enter .46s var(--ez) both}
.reflection-overlay.shown .reflection-bubble:nth-child(2){animation-delay:.08s}
.reflection-overlay.shown .reflection-bubble:nth-child(3){animation-delay:.16s}
@keyframes reflection-shade{from{opacity:0}to{opacity:1}}
@keyframes reflection-enter{
  from{opacity:0;transform:translate(var(--offset),18px) scale(.95)}
  to{opacity:1;transform:none}
}

/* 성과 팝업 카드(정책연구 성과보고의 팝업 구도) */
.pop{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(12,18,34,.58);backdrop-filter:blur(2px)}
.pop .pc{max-width:1280px;padding:52px 72px 48px;border-radius:30px;background:#fff;text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.35);transform:scale(.9);transition:transform .7s var(--ez)}
.pop.shown .pc{transform:none}
.pop .pc .k{display:inline-block;margin-bottom:18px;padding:6px 18px;border-radius:999px;background:var(--c-l);color:var(--c);font:700 22px var(--f-body)}
.pop .pc .big{font:400 68px/1.25 var(--f-title);letter-spacing:-.02em;color:var(--ink)}
.pop .pc .big em{font-style:normal;color:var(--c)}
.pop .pc p{margin:20px 0 0;font:500 27px/1.5 var(--f-body);color:var(--ink2)}

.more{position:absolute;right:80px;bottom:44px;z-index:4;height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--c);background:#fff;color:var(--c);font:700 20px var(--f-body);cursor:pointer}
.more:hover{background:var(--c);color:#fff}
.dark .more{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}

.num{font:800 1em var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tag{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--c-l);color:var(--c);font:700 var(--label-size) var(--f-body);white-space:nowrap}
.hot{cursor:pointer}
.hot:hover{outline:3px solid var(--c);outline-offset:4px}
.ring{animation:ring 1.4s ease-out 1}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,213,74,.75)}100%{box-shadow:0 0 0 22px rgba(255,213,74,0)}}

/* ----- 화면 전체 장치 ----- */
#prog{position:absolute;left:0;right:0;bottom:0;height:8px;display:flex;gap:3px;z-index:20;background:rgba(14,20,36,.08)}
#prog i{position:relative;display:block;height:100%;background:rgba(38,53,94,.16)}
#prog i b{position:absolute;left:0;top:0;bottom:0;background:var(--pc,#26355E);transition:width .5s var(--ez)}
#ctr{position:absolute;right:22px;bottom:16px;z-index:20;font:600 15px var(--f-body);color:rgba(30,37,51,.45)}
.isdark #ctr{color:rgba(255,255,255,.4)}
#black{position:absolute;inset:0;z-index:90;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}
.blackout #black{opacity:1;pointer-events:auto}

/* 근거 서랍 */
#scrim{position:absolute;inset:0;z-index:60;background:rgba(10,16,28,.42);opacity:0;pointer-events:none;transition:opacity .3s}
#drawer{position:absolute;z-index:61;top:0;right:0;width:760px;height:1080px;background:#fff;padding:52px 56px;transform:translateX(102%);transition:transform .45s var(--ez);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.dr-open #scrim{opacity:1;pointer-events:auto}.dr-open #drawer{transform:none}
#drawer .x{position:absolute;right:30px;top:24px;border:0;background:none;font-size:44px;color:var(--mute);cursor:pointer}
#drawer .dp{font:700 19px var(--f-body);color:var(--navy)}
#drawer h2{margin:12px 0 22px;font:400 36px/1.35 var(--f-title)}
#drawer .dtabs{display:flex;gap:26px;border-bottom:2px solid var(--line)}
#drawer .dtabs button{border:0;background:none;padding:0 0 10px;margin-bottom:-2px;border-bottom:3px solid transparent;font:700 21px var(--f-body);color:var(--mute);cursor:pointer}
#drawer .dtabs button.on{color:var(--ink);border-color:var(--navy)}
#drawer .dbody{margin-top:22px;font:500 21px/1.65 var(--f-body);color:var(--ink2)}
#drawer table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:20px}
#drawer th{text-align:left;font-weight:600;color:var(--mute);padding:0 8px 8px 0;border-bottom:1.5px solid var(--line)}
#drawer td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
#drawer td.n,#drawer th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#drawer .note{margin-top:20px;font-size:18px;color:var(--mute)}

/* 쪽 목록 */
#ov{position:absolute;inset:0;z-index:70;background:rgba(243,246,250,.97);padding:56px 72px;opacity:0;pointer-events:none;transition:opacity .3s;overflow:auto}
.ov-open #ov{opacity:1;pointer-events:auto}
#ov h3{margin:0 0 6px;font:400 40px var(--f-title)}
#ov .hint{font:600 19px var(--f-body);color:var(--mute);margin-bottom:22px}
#ov .grp{margin:16px 0 6px;font:700 20px var(--f-body);color:var(--mute)}
#ov .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
#ov button{position:relative;height:96px;padding:12px 14px 12px 20px;text-align:left;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 19px/1.3 var(--f-body);color:var(--ink);overflow:hidden}
#ov button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
#ov button span{display:block;font:700 15px var(--f-body);color:var(--mute);margin-bottom:4px}
#ov button.cur{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}
#ov button:hover{border-color:var(--c)}

/* ===== 장면별 ===== */
/* 학교 항공 영상 */
.opening .bgv,.ending .bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* 교감선생님·장학지원단 소개 — 제목으로 시작해 한 분씩 공개한다. */
.slide.introduction{
  --intro-gold:#f5d89a;
  background:radial-gradient(ellipse at 98% -28%,#506286 0%,transparent 56%),
    radial-gradient(ellipse at 0% 121%,#2b4c63 0%,transparent 52%),#101e35;
}
.introduction .intro-orbits{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.intro-orbits i{
  position:absolute;width:1960px;height:1050px;border:2px solid #e4bc733f;border-radius:50%;
  box-shadow:0 0 0 14px #efcd8910,0 0 0 46px #d6e3ed0b,0 0 0 95px #a7bfd708;
  transform:rotate(-27deg);transition:transform 1.5s var(--ez);
}
.intro-orbits i:first-child{left:-1040px;top:-815px}
.intro-orbits i:last-child{right:-980px;bottom:-825px}
.introduction:has(.intro-person.shown) .intro-orbits i{transform:rotate(-19deg)}
.introduction .intro-heading{
  position:absolute;left:0;right:0;top:50%;margin:0;text-align:center;
  font:400 110px/1.2 var(--f-title);letter-spacing:-.035em;color:#f9f4e9;
  translate:0 -50%;transition:transform .85s var(--ez),color .65s ease;
}
.introduction:has(.intro-person.shown) .intro-heading{transform:translateY(-398px) scale(.43);color:#e4e8ed}
.introduction .intro-person{
  position:absolute;inset:0;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;
  transform:none;transition:none;
}
.introduction [data-step]:not(.shown){visibility:hidden}
.intro-person p{align-self:end;margin:0 0 28px;font:600 42px/1.25 var(--f-body);letter-spacing:.065em;color:var(--intro-gold)}
.roster .intro-person p{font-size:58px;letter-spacing:.025em}
.intro-person h3{margin:0;font:400 148px/1.2 var(--f-title);letter-spacing:-.025em;color:#fff8e7;white-space:nowrap}
.intro-letters{display:block;overflow:clip}
.intro-letters>span{display:inline-block}
.intro-date{position:absolute;left:0;right:0;bottom:80px;text-align:center;font:500 27px var(--f-body);color:#c3cbd4}
.intro-underline{
  position:relative;width:960px;height:2px;margin-top:40px;
  background:linear-gradient(90deg,transparent,#cfab63 27%,#fff2c4 50%,#cfab63 73%,transparent);
}
.intro-underline i{
  position:absolute;top:-29px;left:0;width:110px;height:60px;opacity:0;
  background:radial-gradient(ellipse 12px 24px,#fff9df 0%,#ffda9170 24%,transparent 62%),
    radial-gradient(ellipse closest-side,#fff9df 3%,#ffd072a1 14%,#ffc87a33 39%,transparent 90%);
}
.intro-person.shown p{animation:vp-school-in .8s var(--ez) .22s both}
.intro-person.shown .intro-letters>span{
  animation:vp-type-in .79s cubic-bezier(.18,.82,.22,1) var(--delay) both;
}
.intro-person.shown .intro-underline{animation:vp-line-in .95s var(--ez) .3s both}
.intro-person.shown .intro-underline i{animation:vp-glint 1.05s ease-in-out .48s both}
.intro-date.shown{animation:vp-school-in .65s var(--ez) .7s both}
@keyframes vp-type-in{
  from{transform:translateY(110%) skewY(6deg);color:#d9ab63}
  72%{color:#ffe0a0}
  to{transform:none;color:#fff8e7}
}
@keyframes vp-school-in{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:none}}
@keyframes vp-line-in{from{transform:scaleX(.03);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes vp-glint{
  0%{left:0;opacity:0}20%{opacity:.95}75%{opacity:.88}100%{left:calc(100% - 110px);opacity:0}
}

/* 순서 */
.agenda .big{position:absolute;left:120px;top:150px;font:400 96px var(--f-fun)}
.agenda .grid{position:absolute;left:120px;right:120px;top:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.agenda .it{position:relative;height:250px;padding:34px 36px;background:#fff;border-radius:26px;border:1.5px solid var(--line)}
.agenda .it .no{font:800 30px var(--f-body);color:var(--mute)}
.agenda .it .t{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);text-align:center;font:400 60px/1.25 var(--f-title)}
.agenda .it.hl{background:var(--navy);border-color:var(--navy);color:#fff}
.agenda .it.hl .no{color:rgba(255,255,255,.75)}

/* 오프닝 */
/* 멈춘 학교 사진은 확대하지 않음: 느린 확대(1→1.04, 14초)가 사진을 매 프레임 소수점 픽셀로 다시 그려 떨려 보였음(11. 7. 제거) */
.opening .cap{position:absolute;inset:0;display:flex;align-items:center;width:100%;height:100%;padding:0 146px;border:0;text-align:left;cursor:pointer;color:#fff;
  background:linear-gradient(90deg,#07121d 0%,rgba(7,18,29,.96) 20%,rgba(7,18,29,.80) 37%,rgba(7,18,29,.19) 63%,rgba(7,18,29,.06) 100%)}
.opening .cap:focus-visible{outline:3px solid #ffe0a1;outline-offset:-12px}
.opening .flight-title{display:block;transform:translateY(-12px)}
.opening .flight-year{display:flex;align-items:center;gap:22px;margin:0 0 36px 5px;color:#ffdb8f;font:700 40px/1.25 var(--f-body);letter-spacing:.025em}
.opening .flight-year i{position:relative;display:block;width:96px;height:3px;transform-origin:left;background:linear-gradient(90deg,transparent,#ffcb62)}
.opening .flight-year i::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#ffe8ad;box-shadow:0 0 16px #ffc95d}
.opening .flight-line{display:block;overflow:hidden;font:400 122px/1.16 var(--f-kid);letter-spacing:-.035em}
.opening .flight-line>span{display:block}
.opening .flight-line em{color:#ffdb8f;font-style:normal}
.opening.on.built:not(.playing):not(.arrived) .flight-year{animation:flightYearIn .72s .1s both}
.opening.on.built:not(.playing):not(.arrived) .flight-year i{animation:flightLineIn .85s .1s both}
.opening.on.built:not(.playing):not(.arrived) .flight-line>span{animation:flightTitleIn .98s .22s cubic-bezier(.16,.8,.22,1) both}
.opening.on.built:not(.playing):not(.arrived) .flight-line:last-child>span{animation-delay:.37s}
@keyframes flightYearIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
@keyframes flightLineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flightTitleIn{from{opacity:0;transform:translateY(104%) skewY(3deg)}to{opacity:1;transform:none}}
.opening.playing .cap{opacity:0;pointer-events:none;transition:opacity .48s .12s ease}
.opening.playing .flight-title{opacity:0;transform:translate(54px,-26px);transition:transform .48s cubic-bezier(.55,0,.8,.48),opacity .36s ease}
.opening.arrived .cap{visibility:hidden;opacity:0;pointer-events:none}
.opening .school-sparkles{position:absolute;inset:0;pointer-events:none;visibility:hidden}
.opening.on.arrived .school-sparkles{visibility:visible}
.opening .school-sparkles i{position:absolute;width:25px;height:25px;opacity:0;animation:schoolSparkle 3.8s var(--delay) infinite;filter:drop-shadow(0 0 9px #fff5b4)}
.opening .school-sparkles i::before,.opening .school-sparkles i::after{content:"";position:absolute;left:50%;top:50%;background:linear-gradient(transparent,#fff8d0 40%,#fff 50%,#fff8d0 60%,transparent);transform:translate(-50%,-50%)}
.opening .school-sparkles i::before{width:3px;height:100%}
.opening .school-sparkles i::after{width:100%;height:3px}
@keyframes schoolSparkle{0%,48%,100%{opacity:0;transform:scale(.3)} 62%{opacity:.95;transform:scale(1)} 80%{opacity:.35;transform:scale(.65)}}
.static .opening .school-sparkles{display:none}


/* 학교 현황 */
.school .tiles{position:absolute;left:80px;top:290px;width:900px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.school .tile{height:250px;padding:30px 34px;background:#fff;border-radius:24px;border:1.5px solid var(--line)}
.school .tile .v{font:800 96px/1 var(--f-body);color:var(--c);letter-spacing:-.03em}
.school .tile .v small{font:700 34px var(--f-body);color:var(--ink);margin-left:6px}
.school .tile .l{margin-top:14px;font:600 26px var(--f-body);color:var(--ink2)}
.school .tile .l i{display:block;font-style:normal;font-size:21px;color:var(--mute);margin-top:4px}
.school .band{position:absolute;left:80px;right:80px;bottom:56px;display:flex;gap:16px}
.school .band span{flex:1;padding:18px 24px;border-radius:18px;background:var(--c-l);font:600 24px var(--f-body);color:var(--ink);text-align:center}

/* 연혁 */
.history .line{position:absolute;left:170px;right:170px;top:560px;height:6px;border-radius:3px;background:var(--line)}
.history .line b{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#8da4bc,var(--dodum) 62%,var(--navy));transform-origin:left;transform:scaleX(0);transition:transform .98s linear .08s}
.history.built .line b{transform:none}
.history .line::after{content:"";position:absolute;left:-56px;top:-2px;width:64px;height:10px;border-radius:10px;background:linear-gradient(90deg,transparent,#ffcf55 75%,#fff7c5);box-shadow:5px 0 12px #ffd54a85;opacity:0}
body:not(.static) .history.built .line::after{animation:timelineSweep .98s linear .08s}
@keyframes timelineSweep{0%{transform:translateX(0);opacity:0}6%{opacity:1}95%{opacity:1}100%{transform:translateX(1580px);opacity:0}}
.history .yr.rv{transition:opacity .18s ease-out,transform .32s cubic-bezier(.18,.85,.26,1.13)}
.history:not(.built) .yr.up{transform:translate(-12px,24px)}
.history:not(.built) .yr.dn{transform:translate(-12px,-24px)}
.history .yr .d{position:relative}
body:not(.static) .history.built .yr.now .d::after{content:"";position:absolute;inset:-6px;border:4px solid var(--sun);border-radius:50%;pointer-events:none;opacity:0;animation:timelineArrival .44s ease-out var(--arrival)}
@keyframes timelineArrival{0%{transform:scale(.85);opacity:.9}100%{transform:scale(2.25);opacity:0}}
.history .yr{position:absolute;top:470px;width:150px;margin-left:-75px;text-align:center}
.history .yr .d{width:26px;height:26px;margin:72px auto 0;border-radius:50%;background:#fff;border:5px solid #9AA6B8}
.history .yr .y{font:800 30px var(--f-body);color:var(--ink2)}
.history .yr .t{position:absolute;left:-10px;right:-10px;top:150px;font:600 21px/1.35 var(--f-body);color:var(--ink2)}
.history .yr.up .t{top:-118px}
.history .yr.now .d{width:44px;height:44px;margin-top:63px;border-color:var(--c);background:var(--sun)}
.history .yr.now .y{font-size:40px;color:var(--c)}
.history .yr.now .t{font-weight:700;color:var(--c);font-size:23px}
.history .history-spot{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;pointer-events:none;visibility:hidden;transform:none;background:rgba(243,246,250,.76);backdrop-filter:blur(8px);transition:opacity .24s ease,visibility 0s .24s}
.history .history-spot.shown{visibility:visible;transition-delay:0s}
.history-message{margin:0;transform:translateY(40px) scale(.82);transition:transform .45s cubic-bezier(.16,1,.24,1.08);color:var(--navy)}
.history-spot.shown .history-message{transform:none}
.history-message span{display:block;font:600 54px/1.4 var(--f-body)}
.history-message strong{display:block;margin-top:12px;font:400 108px/1.25 var(--f-title);letter-spacing:-.045em}

.question .q-next.shown em{background-size:100% 100%;transition-delay:.34s}

.question .q-next{transform:none;transition:opacity .14s ease,visibility 0s}

.question .q-next .q-label{color:var(--dodum);display:flex;align-items:center;justify-content:center;gap:18px;transform:scale(.84);transition:transform .3s var(--ez)}

.question .q-next .q-label::before,.question .q-next .q-label::after{content:"";width:58px;height:3px;border-radius:3px;background:var(--dodum);transform:scaleX(0);transition:transform .42s var(--ez)}

.question .q-next .q-label::after{transform-origin:left}
.question .q-next.shown .q-label::before,.question .q-next.shown .q-label::after{transform:scaleX(1);transition-delay:.25s}
.question .q-next .q-line>span{transform:translate(56px,112%) rotate(2deg);opacity:0}

.question .q-next.shown .q-line:last-child>span{transition-delay:.20s}
.question .official.shown{transition-delay:.38s}
.static .question .q-label::before,.static .question .q-label::after{transition:none}

@media (max-height:460px) and (orientation:landscape) {
  #photo-gallery .pg-screen { padding-block: 5px; gap: 3px; }

}
@media (prefers-reduced-motion:reduce) { #stage { transition: none; } }
@media print { #photo-gallery { display: none !important; } }

function reflectionPages(id) {
  const entries = window.STUDENT_REFLECTIONS?.[id];
  if (!Array.isArray(entries)) return [];
  const pages = [];
  let group = [];
  function addShortQuotes() {
    if (!group.length) return;
    const quotes = group;
    const fiveFit = quotes.length === 5 && quotes.every(q => q.text.length <= 70 && !q.text.includes('\n'));
    const pageCount = fiveFit ? 1 : Math.ceil(quotes.length / 4);
    let start = 0;
    for (let remaining = pageCount; remaining > 0; remaining--) {
      const size = Math.ceil((quotes.length - start) / remaining);
      pages.push(quotes.slice(start, start + size));
      start += size;
    }
    group = [];
  }
  for (const entry of entries) {
    const value = typeof entry === 'string' ? entry : entry?.text;
    const text = typeof value === 'string' ? value.trim() : '';
    if (!text) continue;
    const image = typeof entry?.image === 'string' ? entry.image.trim() : '';
    const quote = {text, image, byline:'참여 학생'};
    if (text.length > 140 || text.split('\n').length > 3) {
      // 긴 소감도 학생 한 명의 글을 온전히 하나의 말풍선에 담는다.
      addShortQuotes();
      pages.push([quote]);
    } else {
      group.push(quote);
    }
  }
  addShortQuotes();
  return pages;
}
function reflections(id, step) {
  const pages = reflectionPages(id);
  if (!pages.length) return '';
  const stacks = pages.map((page, i) => `<div class="reflection-stack" data-step="${step + i}" hidden>

      const body = image
        ? `<img class="reflection-handwriting" src="media/reflections/${encodeURIComponent(image)}" alt="${esc(text)}">`
        : `<span>${esc(text)}</span>`;
      return `<blockquote class="reflection-bubble">${body}${byline ? `<footer>${esc(byline)}</footer>` : ''}</blockquote>`;
    }).join('')}
    </div>`).join('');
  return `<section class="reflection-overlay" aria-label="${REFLECTION_TITLES[id]} 학생 소감문" tabindex="-1" hidden>
    <div class="reflection-content"><h3>${REFLECTION_TITLES[id]}${pages.length > 1 ? ' <small class="reflection-progress"></small>' : ''}</h3>${stacks}</div></section>`;
}

    state.shadow.style.opacity=String(.22*Math.sin(Math.PI*progress(time,1.64,3.25)));
    state.trail.style.strokeDasharray=Math.min(.24,u)+' 2';
    state.trail.style.strokeDashoffset=String(-Math.max(0,u-.24));
    state.trail.style.opacity=String(.93*fade*weight);
    placeDot(state.tip,p,.98*weight);

    const line=easeInOut(progress(time,2.56,3.39));

      lane.trail.style.strokeDasharray=Math.min(tail,travel)+' 2';
      lane.trail.style.strokeDashoffset=String(-Math.max(0,travel-tail));

      placeDot(lane.point,where,weight);

    state.bloom.style.opacity=String(.42+.54*pulse);

  }

  function render(root,time) {
    const state=model(root);

    const gain=(a,b)=>progress(t,a,b);
    state.photo.style.transform='scale('+(1.055-.055*easeOut(gain(0,5.45)))+')';

  function leave(root) {
    const state=records.get(root);

  function enter(root,staticMode=false) {
    leave(root);

        if(!state.introComplete){render(root,duration);state.introComplete=true;}

    };
    state.introComplete=false;
    tick(start);
  }
  window.coverMotion={enter,leave,render};
})();

      value.style.opacity = opacity;
      value.style.transform = 'translateY(' + offset*travel + 'px)';
      value.setAttribute('aria-hidden', String(opacity===0 || i!==(fraction<.5 ? leg : leg+1)));
    });
  }
  function drawGroup(row, g, leg, time) {
    const startCount = g.counts[leg], endCount = g.counts[leg+1];
    const gain = endCount > startCount;
    const count = Math.abs(endCount - startCount);
    const cellDuration = .32;
    const stagger = (g.end - g.start - cellDuration) / Math.max(1, count-1);
    let visible = 0;
    row.people.forEach((cell, index) => {
      let occupancy = index < startCount ? 1 : 0;
      if (index >= Math.min(startCount,endCount) && index < Math.max(startCount,endCount)) {
        const order = gain ? index - startCount : startCount - 1 - index;
        const start = g.start + order * stagger;
        const p = ease(progress(time, start, start + cellDuration));
        occupancy = gain ? p : 1 - p;
      }
      if (occupancy !== row.occupancy[index]) {
        cell.style.opacity = occupancy;
        cell.style.transform = 'translateY(' + ((1-occupancy)*(gain?14:-12)) + 'px) scale(' + (.62+.38*occupancy) + ')';
        row.occupancy[index] = occupancy;
      }
      if (occupancy >= .5) visible++;
    });
    // Keep the October 1 comparison intact at rest, then switch baselines as the date flips.
    const retiring = leg>0 && time<.48;
    const reference = retiring ? leg-1 : leg;
    const prior = retiring ? 1-ease(progress(time,.05,.48)) : ease(progress(time,g.start-.08,g.start+.24));
    row.prior.style.opacity = prior;
    row.prior.style.transform = 'translateX(' + ((1-prior)*9) + 'px)';
    row.prior.setAttribute('aria-hidden', String(prior===0));
    const delta = visible-g.counts[reference];
    row.delta.style.opacity = delta===0 ? 0 : retiring ? prior : 1;
    if (row.reference!==reference || row.visible!==visible) {
      row.priorLabel.textContent = dates[reference].label+' '+g.counts[reference]+'명';
      row.number.textContent = String(visible);
      row.delta.textContent = delta ? dates[reference].label+' 대비 '+(delta>0?'+':'−')+Math.abs(delta)+'명' : '';
      row.row.setAttribute('aria-label',g.name+' '+g.grades+', '+visible+'명');
      row.visible = visible;
      row.reference = reference;
    }
  }
  function drawTotal(s, leg, roll) {
    const from = totals[leg], to = totals[leg+1];
    const distance = Math.abs(to-from)*roll;
    const whole = from+Math.sign(to-from)*Math.floor(distance);
    const next = whole===to ? to : whole+Math.sign(to-from);
    const fraction = distance%1;
    const a = String(whole).padStart(s.tapes.length,' '), b = String(next).padStart(s.tapes.length,' ');
    s.tapes.forEach((tape,i) => {
      if (tape.firstElementChild.textContent!==a[i]) tape.firstElementChild.textContent = a[i];
      if (tape.lastElementChild.textContent!==b[i]) tape.lastElementChild.textContent = b[i];
      tape.style.transform = 'translateY('+ (a[i]===b[i] ? 0 : -50*fraction) +'%)';
    });
    s.total.textContent = (fraction<.5 ? whole : next)+'명';
  }
  function draw(s, absoluteTime) {
    s.time = absoluteTime;
    s.el.dataset.kidsTime = String(absoluteTime);
    // Exactly at an endpoint, show the completed comparison to its previous date.
    const leg = Math.max(0, Math.ceil(absoluteTime/duration)-1);
    const time = absoluteTime - leg*duration;
    if (leg!==s.leg) {
      s.fromLeaves.forEach(leaf => { leaf.innerHTML = dateMarkup(dates[leg]); });
      s.toLeaves.forEach(leaf => { leaf.innerHTML = dateMarkup(dates[leg+1]); });
      s.leg = leg;
    }
    const turn = progress(time, .12, .95);
    const top = ease(clamp(turn*2)), bottom = 1 - Math.pow(1-clamp((turn-.5)*2), 2.6);
    s.fold.style.transform = 'rotateX(' + (-90*top) + 'deg)';
    s.fold.style.visibility = turn < .5 ? 'visible' : 'hidden';
    s.fold.style.filter = 'brightness(' + (1-.32*top) + ')';
    s.rise.style.transform = 'rotateX(' + (90*(1-bottom)) + 'deg)';
    s.rise.style.visibility = turn < .5 ? 'hidden' : 'visible';
    s.rise.style.filter = 'brightness(' + (.65+.35*bottom) + ')';
    const dateIndex = turn < .5 ? leg : leg+1;
    s.month.textContent = dates[dateIndex].label;
    s.dates.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.kidsStep===dateIndex)));
    const route = (leg+ease(progress(time,.10,1.02)))/(dates.length-1);
    s.rail.style.transform = 'scaleX(' + route + ')';
    s.cursor.style.left = (100*route) + '%';
    drawTotal(s,leg,ease(progress(time,1.98,2.56)));
    crossfade(s.summary,leg,ease(progress(time,2.40,2.75)),13);
    crossfade(s.composition,leg,ease(progress(time,2.36,2.77)),23);
    s.rows.forEach((row,i) => drawGroup(row,groups[i],leg,time));
    CountryMotion.draw(s.el,leg,time);
    const at = Math.round(s.target/duration);
    s.replayLabel.textContent = at >= dates.length-1 ? '다시 보기' : at === 0 ? '전환 보기' : dates[at+1].label+' 보기';
  }
  function settled(s) {
    const i = Math.round(s.time/duration);
    s.status.textContent = dates[i].label+', 전체 '+totals[i]+'명. '+
      groups.map(g => g.name+' '+g.counts[i]+'명').join(', ')+'.';
  }
  function stop(s) {
    cancelAnimationFrame(s.frame);
    s.frame = 0;
    s.onComplete = null;
  }
  function enter(el, n, instant) {
    let s = states.get(el);
    if (!s) { s = bind(el); states.set(el,s); }
    stop(s);
    s.instant = instant;
    s.target = endpoint(n);
    draw(s,s.target);
    settled(s);
  }
  function step(el, n, onComplete = null) {
    const s = states.get(el);
    const target = endpoint(n);
    if (s.target===target && (s.frame || s.time===target)) {
      s.onComplete = onComplete;
      return;
    }
    stop(s);
    s.target = target;
    s.onComplete = onComplete;
    const start = s.time, startedAt = performance.now();
    const direction = target>start ? 1 : -1;
    // 연속으로 넘길 때 이미 지난 날짜의 재생 시간이 쌓이지 않게 한다.
    const speed = 1.2 * Math.max(1, Math.abs(target - start) / duration);
    const tick = now => {
      const time = start+direction*(now-startedAt)*speed/1000;
      const done = s.instant || reduced.matches || direction*(target-time)<=0;
      draw(s,done ? target : time);
      if (done) {
        const notify = s.onComplete;
        s.onComplete = null;
        s.frame = 0;
        settled(s);
        if (notify) notify();
      } else s.frame = requestAnimationFrame(tick);
    };
    tick(startedAt);
  }
  function replay(el, onFirstLegComplete) {
    const s = states.get(el);
    stop(s);
    draw(s,0);
    step(el,1,onFirstLegComplete);
  }
  return {
    dateCount: dates.length, duration, person, markup, enter, step, replay,
    enrollment: dates.map((date, i) => ({
      date:date.label, counts:[groups[0].counts[i], groups[1].counts[i], totals[i]]
    })),
    leave:el => { const s=states.get(el); if (s) stop(s); }
  };
})();

/* 7쪽 오른쪽 '나라별 인원' 패널(11. 10. 통합안). 반별 인원(kids-motion.js)과 같은 네 기준일·같은 시간축으로 움직인다.
   어린이 그림 하나는 학생 한 명. 떠난 자리는 옅은 그림으로 남고(직전 기준일 이후 떠난 자리는 붉게),
   새로 온 학생은 초록 바탕으로 들어온다. 이전의 원형차트(비율) 화면은 이 패널로 대체했다.
   3월 1일은 한국어학급 운영위원회 회의록(9. 30.) 붙임 명부의 학년 초 명단(취소선 학생 포함, 8. 20. 취학 4명 제외)을 국적별로 센 값.
   10월 1일·10월 20일의 일본 1명·귀국학생 8명 구분은 사용자 지정값이다. */
const CountryMotion = (() => {
  const dates = KidsMotion.enrollment.map(snapshot => snapshot.date);
  const totals = [28, 25, 23, 18];
  const groups = [
    {name:'인도네시아',     color:'#237563', counts:[5,5,3,2]},
    {name:'사우디아라비아', color:'#DDA446', counts:[4,4,4,4]},
    {name:'필리핀',         color:'#527D94', counts:[3,1,1,1]},
    {name:'키르기스스탄',   color:'#4F88AC', counts:[2,2,2,0]},
    {name:'몽골',           color:'#AD666D', counts:[2,2,1,0]},
    {name:'카자흐스탄',     color:'#8179A7', counts:[1,1,1,0]},
    {name:'튀르키예',       color:'#8E7064', counts:[1,1,0,0]},
    {name:'말레이시아',     color:'#8C9B55', counts:[1,1,1,1]},
    {name:'인도',           color:'#C88963', counts:[1,1,1,1]},
    {name:'일본',           color:'#C66B86', counts:[0,0,1,1]},
    {name:'귀국학생',       color:'#A9B2BF', counts:[8,7,8,8], home:true}
  ];
  const records = new WeakMap();
  const person = KidsMotion.person;
  const RETIRE = .3;          /* 구간이 시작되면 직전 구간의 '떠남·새로 옴' 표시를 거둔다 */
  const FIRST = .7, SPAN = 1.3, STAGGER = .14, SETTLE = .2;

  function summary(i) {
    const abroad = groups.filter(g => !g.home && g.counts[i] > 0);
    const home = groups.filter(g => g.home).reduce((n, g) => n + g.counts[i], 0);
    return `${abroad.length}개국 ${abroad.reduce((n, g) => n + g.counts[i], 0)}명 · 귀국학생 ${home}명`;
  }
  function tableMarkup() {
    return `<thead><tr><th scope="col">국가 / 구분</th>${dates.map(d=>`<th scope="col">${d}</th>`).join('')}</tr></thead>
      <tbody>${groups.map(g=>
        `<tr><th scope="row">${g.name}</th>${g.counts.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><th scope="row">전체 (명)</th>${totals.map(v=>`<td>${v}</td>`).join('')}</tr></tfoot>`;
  }
  function markup() {
    const rows = groups.map(g => `<div class="cp-row">
        <span class="cp-name"><i class="cp-dot" style="background:${g.color}"></i>${g.name}</span>
        <span class="cp-people" aria-hidden="true">${('<i class="cp-slot" data-s="none">' + person + '</i>').repeat(Math.max(...g.counts))}</span>
        <b class="cp-count"></b><span class="cp-delta"></span>
      </div>`).join('');
    return `<section class="cpanel" aria-label="나라별 인원">
      <div class="cp-top"><h3>나라별 인원</h3><span class="cp-sum"></span></div>
      <div class="cp-rows">${rows}</div>
      <div class="cp-key" aria-hidden="true">
        <span><i class="cp-slot" data-s="on">${person}</i>재학</span>
        <span><i class="cp-slot" data-s="new">${person}</i>새로 옴</span>
        <span><i class="cp-slot" data-s="left">${person}</i>이번에 떠남</span>
        <span><i class="cp-slot" data-s="gone">${person}</i>이전에 떠남</span>
      </div>
    </section>
    <dialog class="country-detail" aria-labelledby="country-comparison-heading"><div class="d-top"><h2 id="country-comparison-heading">네 시점의 국가별 집계</h2><button type="button" data-country-close autofocus aria-label="닫기">×</button></div>
      <table>${tableMarkup()}</table>
      <p class="d-note">10월 1일과 10월 20일은 일본 1명과 귀국학생 8명으로 표시했습니다.</p>
    </dialog>`;
  }

  function bind(el) {
    const panel = el.querySelector('.cpanel'), dialog = el.querySelector('.country-detail');
    const model = {
      dialog, sum:panel.querySelector('.cp-sum'), page:-1,
      rows:[...panel.querySelectorAll('.cp-row')].map(row => ({
        row, slots:[...row.querySelectorAll('.cp-slot')], count:row.querySelector('.cp-count'), delta:row.querySelector('.cp-delta'),
        states:[], shown:-1, change:null
      }))
    };
    el.querySelector('[data-country-details]').addEventListener('click', () => dialog.showModal());
    dialog.querySelector('[data-country-close]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const b = dialog.getBoundingClientRect();
      if (event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom) dialog.close();
    });
    records.set(el, model);
    return model;
  }
  /* 기준일 i에 멈춰 있을 때 j번째 자리의 모습. mark: 직전 기준일과 달라진 자리를 표시할지 */
  function settled(counts, i, j, mark) {
    if (j < counts[i]) return mark && i > 0 && j >= counts[i-1] ? 'new' : 'on';
    if (mark && i > 0 && j < counts[i-1]) return 'left';
    return j < Math.max(...counts.slice(0, i+1)) ? 'gone' : 'none';
  }
  /* leg: dates[leg] → dates[leg+1] 구간, time: 그 구간 안의 시각(0 ~ KidsMotion.duration) */
  function draw(el, leg, time) {
    const s = records.get(el) || bind(el);
    const keep = leg > 0 && time < RETIRE;
    const changed = groups.filter(g => g.counts[leg] !== g.counts[leg+1]);
    s.rows.forEach((r, gi) => {
      const g = groups[gi], c = g.counts, a = c[leg], b = c[leg+1];
      const start = FIRST + changed.indexOf(g) * SPAN / Math.max(1, changed.length);
      let present = 0;
      r.slots.forEach((slot, j) => {
        const order = b < a ? a - 1 - j : j - a;
        const moves = j >= Math.min(a, b) && j < Math.max(a, b);
        const done = moves ? time >= start + order * STAGGER + SETTLE : time >= KidsMotion.duration;
        const state = done ? settled(c, leg+1, j, true) : settled(c, leg, j, keep);
        if (state !== r.states[j]) { slot.dataset.s = state; r.states[j] = state; }
        if (state === 'on' || state === 'new') present++;
      });
      const reference = keep ? c[leg-1] : a;
      const change = present - reference;
      if (present !== r.shown || change !== r.change) {
        r.count.textContent = present + '명';
        r.delta.textContent = change ? (change > 0 ? '+' : '−') + Math.abs(change) : '';
        r.delta.dataset.kind = change > 0 ? 'in' : 'out';
        r.row.classList.toggle('zero', present === 0);
        r.shown = present; r.change = change;
      }
    });
    const page = time >= 2.3 ? leg + 1 : leg;
    if (page !== s.page) { s.sum.textContent = summary(page); s.page = page; }
  }
  function dialogOpen(el) {return records.get(el)?.dialog.open || false;}
  function closeDetails(el) {if (dialogOpen(el)) records.get(el).dialog.close();}
  return {dateCount:dates.length, summary, markup, draw, dialogOpen, closeDetails};
})();

/* 16쪽 '공감하다' — 장 표지 → 6~11월 방송이 공중에 펼쳐짐 → 11월 필리핀을 가운데에서 선택 재생.
   media/vr/vr_MM.jpg는 방송 첫 화면에서 학생 모습을 가린 이미지다. */
const GreetVR = (() => {
  const P = 1500, W = 1100;   /* 카메라 거리(perspective), 카드 기준 폭 */
  const CARDS = [['06', '키르기스스탄'], ['07', '튀르키예'], ['08', '인도'], ['09', '몽골'], ['10', '인도네시아·말레이시아'], ['11', '필리핀']];
  /* [화면 중심 x, y, 화면에서 보이는 폭, 기울기] — 폭이 작을수록 멀리 있음 */
  const SCATTER = [[330, 400, 380, -3], [640, 770, 500, 2], [960, 360, 300, -2], [1150, 600, 420, 3], [1590, 350, 340, -2], [1570, 815, 520, 2]];
  const FOCUS = 5, FOCUS_AT = [960, 560, 1000, 0];

  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = Array.from({length: 90}, () =>
    `<i class="vr-star" style="transform:translate3d(${((rnd() - .5) * 5200).toFixed(0)}px,${((rnd() - .62) * 2400).toFixed(0)}px,${(-300 - rnd() * 4200).toFixed(0)}px);--td:${(2.5 + rnd() * 4).toFixed(2)}s;--tdl:${(-rnd() * 5).toFixed(2)}s"></i>`).join('');

  const html = film => `<div class="vr" hidden>
<div class="vr-view"><div class="vr-world"><div class="vr-floor"></div><div class="vr-burst"></div>${stars}${CARDS.map(([mm, country], i) => `<div class="vr-card"><div class="bob" style="--bd:${(5.2 + i * .55).toFixed(2)}s;--bdl:${(-i * 1.3).toFixed(1)}s"><figure class="scr"><img src="media/vr/vr_${mm}.jpg" alt="${+mm}월 친구의 인사 방송 첫 화면">${i === FOCUS ? filmTrigger(film) : ''}</figure><div class="tag"><span class="mo">${+mm}월</span>${country}</div></div></div>`).join('')}</div></div>
<div class="vr-hud"><span class="chip"><i>3</i>공감하다 · 친구의 인사</span><h1>친구의 말로 인사하는 학교</h1><p>2026. 6.~11. ‘친구의 인사’ 아침 방송의 첫 화면</p></div>
<div class="vr-cap" data-step="2"><span><em>이번 달</em> · 11월 필리핀<b>Kumusta 꾸무스타</b></span></div>
</div>`;

  /* 화면 위 자리 → 3D 위치: 폭 w로 보이려면 s = w / W, 깊이 z = P - P / s */
  const place = ([sx, sy, w, rz], flat) => {
    const s = w / W, z = P - P / s, x = (sx - 960) / s, y = (sy - 540) / s;
    const ry = flat ? 0 : -Math.atan2(x, P - z) * 180 / Math.PI * 1.15;
    return `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz}deg)`;
  };
  const START = i => `translate3d(0px,1200px,-26000px) rotateY(${(i % 2 ? 1 : -1) * 70}deg) rotateZ(${(i % 3 - 1) * 25}deg)`;

  /* 마우스 시차(공용) */
  let mx = 0, my = 0;
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

  const parts = el => { const vr = el.querySelector('.vr'); return {vr, world: vr.querySelector('.vr-world'), cards: [...vr.querySelectorAll('.vr-card')]}; };
  const st = el => el._vr || (el._vr = {step: null, raf: 0, timer: 0, drift: 1, target: 1, tx: 0, ty: 0});

  function loop(el) {
    const s = st(el), {world} = parts(el);
    const started = performance.now();
    const frame = now => {
      const t = (now - started) / 1000;
      s.drift += (s.target - s.drift) * .03; s.tx += (mx - s.tx) * .04; s.ty += (my - s.ty) * .04;
      const yaw = (Math.sin(t * 2 * Math.PI / 17) * 5 + s.tx * 8) * s.drift;
      const pitch = (Math.sin(t * 2 * Math.PI / 23) * 1.8 - s.ty * 4) * s.drift;
      world.style.transform = `rotateX(${pitch.toFixed(3)}deg) rotateY(${yaw.toFixed(3)}deg)`;
      s.raf = requestAnimationFrame(frame);
    };
    s.raf = requestAnimationFrame(frame);
  }
  function stop(el) {
    const s = st(el);
    cancelAnimationFrame(s.raf);
    clearTimeout(s.timer);
  }

  function pose(el, focused, stagger = false) {
    const s = st(el), {cards} = parts(el);
    s.target = focused ? .2 : 1;
    cards.forEach((c, i) => {
      c.classList.toggle('now', focused && i === FOCUS);
      c.classList.toggle('dim', focused && i !== FOCUS);
      c.style.transitionDelay = stagger ? (i * 170) + 'ms' : '0ms';
      c.style.transform = focused && i === FOCUS ? place(FOCUS_AT, true)
        : focused ? place([SCATTER[i][0], SCATTER[i][1], SCATTER[i][2] * .62, SCATTER[i][3]]) : place(SCATTER[i]);
      c.style.opacity = 1;
    });
  }
  function scatter(el) {   /* 깊은 곳 한가운데서 카드가 공중으로 뿌려짐 */
    const s = st(el), {vr, cards} = parts(el);
    cards.forEach((c, i) => { c.style.transition = 'none'; c.style.transform = START(i); c.style.opacity = 0; c.classList.remove('now', 'dim'); });
    void vr.offsetWidth;
    cards.forEach(c => { c.style.transition = ''; });
    const b = vr.querySelector('.vr-burst'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    s.timer = setTimeout(() => pose(el, false, true), 250);
  }

  function reset(el) {
    stop(el);
    const s = st(el), {vr, world} = parts(el);
    s.step = null;
    s.drift = 1;
    s.tx = s.ty = 0;
    world.style.transform = '';
    vr.hidden = true;
    vr.querySelector('.film-trigger').disabled = true;
  }

  function step(el, n, staticMode) {
    const s = st(el);
    if (n === s.step) return;
    const entering = !s.step;
    const {vr} = parts(el);
    clearTimeout(s.timer);
    s.step = n;
    vr.hidden = n === 0;
    vr.querySelector('.film-trigger').disabled = n !== 2;
    if (n === 0) { stop(el); return; }
    if (entering && !staticMode) loop(el);
    if (n === 1 && entering && !staticMode) scatter(el);
    else pose(el, n === 2);
  }

  return {html, reset, step, stop};
})();

      {src: "media/gallery/costumes/03.webp", caption: "전통 의상을 그린 또 다른 학생 작품"},
      {src: "media/gallery/costumes/04.webp", caption: "교실 화면으로 세계 의상 발표를 보는 학생들"},
      {src: "media/gallery/costumes/05.webp", caption: "세계 의상 페스티벌을 보고 그린 작품을 든 학급"},
      {src: "media/gallery/costumes/06.webp", caption: "포르투갈 국기와 함께 그린 분홍색 옷"}

      {src: "media/gallery/play/02.webp", caption: "둘러앉아 놀이하는 친구들"},

<script>/* 활동 사진과 발표 단계에서 같은 영상 프레임을 연다. */
function createFilmPlayer(stage, staticMode) {
  const part = name => document.getElementById('film-' + name);
  const overlay = part('overlay'), frame = part('frame'), screen = part('screen');
  const movie = part('movie'), title = part('title'), closeButton = part('close');
  const play = part('play'), mute = part('mute'), seek = part('seek'), time = part('time');
  const flight = part('flight'), flightImage = new Image(), status = part('status');
  const speaker = part('speaker'), subtitle = part('subtitle');
  flightImage.alt = '';
  let trigger = null, figure = null, animation = null, closing = false;
  let clip = null, afterClose = null, clipFrame = 0;

  const icons = {
    play: 'M7 4v16l14-8z', pause: 'M6 5h4v14H6z M14 5h4v14h-4z',
    sound: 'M3 9v6h4l5 4V5L7 9H3z M15 8a5 5 0 0 1 0 8l-1-1.5a3.2 3.2 0 0 0 0-5z M17 4.5a9.2 9.2 0 0 1 0 15l-1-1.5a7.4 7.4 0 0 0 0-12z',
    muted: 'M3 9v6h4l5 4V5L7 9H3z M15 8l2.5 2.6L20 8l1.3 1.4-2.5 2.6 2.5 2.6L20 16l-2.5-2.6L15 16l-1.3-1.4 2.5-2.6-2.5-2.6z'
  };
  function buttonIcon(button, path, label) {
    if (button.title === label) return;
    button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + path + '"/></svg>';
    button.title = label;
    button.setAttribute('aria-label', label);
  }
  function syncControls() {
    buttonIcon(play, movie.paused ? icons.play : icons.pause, movie.paused ? '재생' : '일시정지');
    buttonIcon(mute, movie.muted ? icons.muted : icons.sound, movie.muted ? '소리 켜기' : '음소거');
  }
  const stamp = seconds => Math.floor(seconds / 60) + ':' + String(Math.floor(seconds % 60)).padStart(2, '0');
  const startTime = () => clip?.start || 0;
  const endTime = () => Number.isFinite(movie.duration) ? Math.min(clip?.end ?? movie.duration, movie.duration) : 0;
  function syncTime() {
    const duration = Math.max(0, endTime() - startTime());
    const current = Math.min(duration, Math.max(0, movie.currentTime - startTime()));
    seek.disabled = !duration;
    seek.max = duration || 1;
    seek.value = current;
    seek.style.setProperty('--progress', (duration ? current / duration * 100 : 0) + '%');
    time.textContent = stamp(current) + ' / ' + stamp(duration);
    seek.setAttribute('aria-valuetext', time.textContent);
  }
  function syncClip() {
    if (!clip || !endTime()) return;
    const t = movie.currentTime, end = endTime();
    movie.volume = Math.max(0, Math.min(1, (t - startTime()) / .6, (end - t) / .6));
    const caption = clip.subs?.find(([a, b]) => t >= a && t < b)?.[2] || '';
    if (subtitle.textContent !== caption) subtitle.textContent = caption;
    if (t >= end) {
      movie.pause();
      if (t > end + .001 && !movie.seeking) movie.currentTime = end;
    }
  }
  function animateClip() {
    syncClip();
    if (clip && !movie.paused) clipFrame = requestAnimationFrame(animateClip);
  }

  function hideFlight() {
    if (animation) animation.cancel();
    animation = null;
    flight.style.visibility = 'hidden';
    figure?.classList.remove('film-origin-hidden');
  }
  function fly(from, to, opening, onFinish) {
    if (animation) animation.cancel();
    const corner = 20 * figure.getBoundingClientRect().width / figure.offsetWidth;
    function box(t, radius, opacity) {
      const point = name => (from[name] + (to[name] - from[name]) * t) + 'px';
      return {left:point('left'), top:point('top'), width:point('width'), height:point('height'), borderRadius:radius + 'px', opacity};
    }
    const keys = opening
      ? [box(0, corner, 1), {...box(.88, 8, 1), offset:.77}, box(1, 7, 0)]
      : [box(0, 7, 0), {...box(.16, 8, 1), offset:.24}, box(1, corner, 1)];
    figure.classList.add('film-origin-hidden');
    flight.style.visibility = 'visible';
    const duration = staticMode ? 0 : (opening ? 730 : 520);
    const current = flight.animate(keys, {duration, easing:'cubic-bezier(.22,.75,.26,1)', fill:'forwards'});
    animation = current;
    const finish = () => {
      if (current !== animation) return;
      hideFlight();
      if (onFinish) onFinish();
    };
    // 발표자 창에 포커스가 있어도 영상 창의 닫기 동작은 끝나야 한다.
    const timeout = setTimeout(finish, duration + 160);
    current.finished.then(finish, finish).finally(() => clearTimeout(timeout));
  }

  function reset(restoreFocus = false) {
    if (!trigger) return;
    const previous = trigger;
    trigger = null;
    cancelAnimationFrame(clipFrame);
    clip = afterClose = null;
    speaker.textContent = subtitle.textContent = '';
    movie.pause();
    movie.volume = 1;
    movie.removeAttribute('src');
    movie.load();
    hideFlight();
    figure = null;
    closing = false;
    stage.inert = false;
    if (restoreFocus) previous.focus({preventScroll:true});
    else if (overlay.contains(document.activeElement)) document.activeElement.blur();
    overlay.inert = true;
    overlay.classList.remove('open', 'unfold');
    overlay.setAttribute('aria-hidden', 'true');
    flightImage.remove();
    flightImage.removeAttribute('src');
  }
  function close() {
    if (!trigger || closing) return;
    closing = true;
    movie.pause();
    const from = animation ? flight.getBoundingClientRect() : screen.getBoundingClientRect();
    overlay.classList.remove('unfold');
    const done = afterClose;
    fly(from, figure.getBoundingClientRect(), false, () => { reset(!done); done?.(); });
  }
  function reportError() {
    if (!trigger || closing) return;
    status.textContent = '영상을 재생할 수 없습니다. 발표 폴더 안의 영상 파일을 확인해 주세요.';
    setTimeout(() => { status.textContent = ''; }, 6000);
    close();
  }
  function playMovie() {
    const origin = trigger;
    movie.play().catch(error => {
      if (trigger !== origin || error.name === 'AbortError') return;
      if (clip && !movie.muted && error.name === 'NotAllowedError') {
        movie.muted = true;
        playMovie();
      } else reportError();
    });
  }
  function open(button, segment = null, onClose = null) {
    if (trigger) return;
    trigger = button;
    clip = segment;
    afterClose = onClose;
    figure = button.closest('figure');
    const photo = figure.querySelector('img');
    const from = figure.getBoundingClientRect();
    flightImage.src = photo.currentSrc || photo.src;
    flight.append(flightImage);
    flightImage.style.transform = getComputedStyle(photo).transform;
    flightImage.style.objectPosition = getComputedStyle(photo).objectPosition;
    title.textContent = button.dataset.filmTitle;
    speaker.textContent = clip?.who || '';
    status.textContent = '';
    overlay.inert = false;
    overlay.setAttribute('aria-hidden', 'false');
    overlay.classList.add('open');
    frame.focus({preventScroll:true});
    stage.inert = true;
    const source = publishedMedia(button.dataset.film);
    movie.src = clip ? source + '#t=' + startTime() + (clip.end == null ? '' : ',' + clip.end) : source;
    movie.volume = clip ? 0 : 1;
    movie.muted = false;
    syncTime();
    syncControls();
    playMovie();
    const to = screen.getBoundingClientRect();
    overlay.classList.add('unfold');
    fly(from, to, true);
  }

  function toggle() {
    if (!trigger || closing) return;
    if (movie.paused) {
      if (clip && movie.currentTime >= endTime() - .05) movie.currentTime = startTime();
      playMovie();
    }
    else movie.pause();
  }
  function handleKey(key, event) {
    if (key === 'Escape') { event?.preventDefault(); close(); return; }
    if (key === 'Tab') {
      const focus = document.activeElement;
      if (event?.shiftKey && (focus === frame || focus === closeButton)) { event.preventDefault(); mute.focus(); }
      else if (event && !event.shiftKey && focus === mute) { event.preventDefault(); closeButton.focus(); }
      return;
    }
    if ((key === ' ' || key === 'Enter') && (!event || document.activeElement === frame)) {
      event?.preventDefault(); toggle();
    }
  }

  closeButton.addEventListener('click', close);
  part('shade').addEventListener('click', close);
  play.addEventListener('click', toggle);
  movie.addEventListener('click', toggle);
  mute.addEventListener('click', () => { movie.muted = !movie.muted; });
  seek.addEventListener('input', () => { if (!seek.disabled) { movie.currentTime = startTime() + Number(seek.value); syncTime(); } });
  for (const event of ['loadedmetadata','timeupdate','seeked','emptied']) movie.addEventListener(event, syncTime);
  for (const event of ['play','pause','volumechange']) movie.addEventListener(event, syncControls);
  movie.addEventListener('playing', () => { cancelAnimationFrame(clipFrame); if (clip) animateClip(); });
  movie.addEventListener('pause', () => cancelAnimationFrame(clipFrame));
  movie.addEventListener('timeupdate', syncClip);
  movie.addEventListener('ended', () => { if (!clip) close(); });
  movie.addEventListener('error', reportError);
  window.addEventListener('pagehide', () => reset());
  return {open, reset, handleKey, get active() { return !!trigger; }, get playsStep() { return !!clip; }};
}

/* 승인된 '슬라이드 위 사진줄'. 슬라이드와 같은 발표 단계가 열린 채로 모달만 전환한다. */
function createPhotoGallery(onChange = () => {}) {
  const dialog = document.createElement('dialog');
  dialog.id = 'photo-gallery';
  dialog.innerHTML = `
    <section class="pg-screen pg-wall-screen" id="pg-wall-screen">
      <header class="pg-header"><span class="pg-pill" id="pg-wall-title">사진 모음</span>
        <button type="button" class="pg-control" id="pg-close"><span class="pg-icon" aria-hidden="true">×</span> 닫기</button>
      </header>
      <div class="pg-rig" id="pg-rig">
        <svg class="pg-ropes" id="pg-ropes" preserveAspectRatio="none" aria-hidden="true" focusable="false"></svg>
        <div class="pg-wall" id="pg-wall" role="group" aria-label="줄에 걸린 사진"></div>
      </div>
      <footer class="pg-footer"><span class="pg-pill pg-tip" id="pg-tip">사진을 누르면 크게 볼 수 있어요.</span>
        <div class="pg-pager" id="pg-pager">
          <button type="button" class="pg-control" id="pg-prev-page" aria-label="이전 모음"><span class="pg-icon" aria-hidden="true">‹</span></button>
          <output id="pg-page-count" aria-live="polite"></output>
          <button type="button" class="pg-control" id="pg-next-page" aria-label="다음 모음"><span class="pg-icon" aria-hidden="true">›</span></button>
        </div>
      </footer>
    </section>
    <section class="pg-screen pg-viewer" id="pg-viewer" hidden>
      <header class="pg-header"><output class="pg-pill" id="pg-photo-count" aria-live="polite"></output>
        <button type="button" class="pg-control" id="pg-back"><span class="pg-icon" aria-hidden="true">‹</span> <span id="pg-back-label">모아보기</span></button>
      </header>
      <div class="pg-view-main" id="pg-view-main">
        <button type="button" class="pg-control" id="pg-prev-photo" aria-label="이전 사진"><span class="pg-icon" aria-hidden="true">‹</span></button>
        <div class="pg-mat" id="pg-mat"><img id="pg-detail" alt=""></div>
        <button type="button" class="pg-control" id="pg-next-photo" aria-label="다음 사진"><span class="pg-icon" aria-hidden="true">›</span></button>
      </div>
      <footer class="pg-footer"><span class="pg-pill pg-caption" id="pg-caption"></span></footer>
    </section>`;
  document.body.append(dialog);
  const part = name => document.getElementById('pg-' + name);
  const rig = part('rig'), wall = part('wall'), ropes = part('ropes'), detail = part('detail');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let album = null, opener = null, page = 0, index = -1, pageSize = 7;
  let resizeFrame = 0, touch = null, ignoreClicksUntil = 0;
  function desiredPageSize() {
    const viewportLimit = window.innerWidth < 720 && window.innerHeight > window.innerWidth ? 4 : 7;
    return Math.min(viewportLimit, album.pageSize || viewportLimit);
  }
  const pages = () => Math.ceil(album.photos.length / pageSize);
  const pageStart = () => page * pageSize;
  const rowOverflows = () => wall.offsetWidth > rig.clientWidth;

  function layout(count, width, height) {
    const singleRow = count <= 4;
    const columns = singleRow ? count : Math.ceil(count / 2);
    const lengths = singleRow ? [count] : [columns, count - columns];
    const rowHeight = height / lengths.length;
    const sag = Math.min(20, rowHeight * .072);
    const gap = Math.max(10, Math.min(32, width * .023));
    const edge = Math.max(7, Math.min(21, width * .015));
    const capacity = (width - 2 * edge - (columns - 1) * gap) / (columns * 1.10);
    const availableCardHeight = singleRow && count > 1 ? rowHeight * .72 : rowHeight;
    const cardWidth = Math.max(4, Math.min(capacity, (availableCardHeight - sag - 16) / .995));
    const cardHeight = cardWidth * .928;
    const centered = Math.max(8, (rowHeight - cardHeight - sag) / 2);
    const spacing = columns === 1 ? 0 :
      Math.min((width - 2 * edge - cardWidth * 1.10) / (columns - 1), cardWidth * 1.34);
    const rows = [], boxes = [];
    lengths.forEach((length, row) => {
      const y = row * rowHeight + centered;
      rows.push({y, sag});
      for (let col = 0; col < length; col++) {
        const cx = width / 2 + (col - (length - 1) / 2) * spacing;
        const u = cx / width;
        boxes.push({cx, top: y + 4 * sag * u * (1 - u), width: cardWidth, height: cardHeight});
      }
    });
    return {rows, boxes};
  }
  function drawRopes(width, height, rows) {
    ropes.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    ropes.replaceChildren();
    function add(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      ropes.append(el);
    }
    const sw = Math.max(2, Math.min(4, width * .0032));
    for (const {y, sag} of rows) {
      const d = 'M0 ' + y + ' Q' + width / 2 + ' ' + (y + 2 * sag) + ' ' + width + ' ' + y;
      add('path', {d, fill:'none', stroke:'#081c1e', 'stroke-width':sw + 2.6, transform:'translate(0 2)', opacity:'.55'});
      add('path', {d, fill:'none', stroke:'#c4a275', 'stroke-width':sw, 'stroke-linecap':'round'});
      add('path', {d, fill:'none', stroke:'#f2d5a2', 'stroke-width':sw * .4, 'stroke-dasharray':'1.6 4', 'stroke-linecap':'round'});
      for (const cx of [2, width - 2]) add('circle', {cx, cy:y, r:sw * 1.25, fill:'#d3b380', stroke:'#64513b', 'stroke-width':1});
    }
  }
  function placeCards(origin) {
    const rect = wall.getBoundingClientRect();
    if (!wall.children.length || rect.width < 1 || rect.height < 1) return;
    const {rows, boxes} = layout(wall.children.length, rect.width, rect.height);
    drawRopes(rect.width, rect.height, rows);
    part('tip').textContent = rowOverflows()
      ? '옆으로 밀어 더 보고, 사진을 누르면 크게 볼 수 있어요.'
      : '사진을 누르면 크게 볼 수 있어요.';
    const angles = [-3, 2.4, -2.4, 2.8, 2.5, -1.8, 2.6];
    const animate = origin && !document.body.classList.contains('static') && !reduced.matches;
    Array.from(wall.children).forEach((card, i) => {
      const box = boxes[i], angle = angles[i], sign = i % 2 === 0 ? -1 : 1;
      Object.assign(card.style, {left:(box.cx - box.width / 2) + 'px', top:box.top + 'px',
        width:box.width + 'px', height:box.height + 'px'});
      card.style.setProperty('--angle', angle + 'deg');
      card.style.setProperty('--captionSize', Math.max(12, Math.min(32, box.width * .091)) + 'px');
      const minCaptionHeight = rows.length === 1 ? 28 : 20;
      card.style.setProperty('--captionH', Math.max(minCaptionHeight, box.height * .199) + 'px');
      if (!animate || !card.animate) return;
      const dx = origin.x - rect.left - box.cx, dy = origin.y - rect.top - box.top;
      card.animate([
        {opacity:0, transform:'translate(' + dx + 'px,' + dy + 'px) scale(.2) rotate(' + sign * 11 + 'deg)', offset:0, easing:'cubic-bezier(.17,.73,.27,1)'},
        {opacity:1, transform:'rotate(' + (angle + sign * 5) + 'deg)', offset:.57, easing:'ease-in-out'},
        {opacity:1, transform:'rotate(' + (angle - sign * 2.4) + 'deg)', offset:.76, easing:'ease-in-out'},
        {opacity:1, transform:'rotate(' + (angle + sign * .8) + 'deg)', offset:.90, easing:'ease-out'},
        {opacity:1, transform:'rotate(' + angle + 'deg)', offset:1}
      ], {duration:750, delay:i * 36, fill:'backwards'});
    });
  }
  function print(photo, i) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'pg-print';
    card.dataset.index = i;
    card.setAttribute('aria-label', '사진 ' + (i + 1) + ' 크게 보기 · ' + (photo.caption || album.title));
    const paper = document.createElement('span'), pic = document.createElement('img');
    const label = document.createElement('span'), peg = document.createElement('span');
    paper.className = 'pg-paper';
    pic.src = publishedMedia(photo.src);
    pic.alt = '';
    pic.draggable = false;
    label.className = 'pg-hand';
    label.textContent = photo.caption;
    peg.className = 'pg-peg';
    peg.setAttribute('aria-hidden', 'true');
    paper.append(pic, label);
    card.append(paper, peg);
    card.addEventListener('click', () => showPhoto(i, true));
    return card;
  }
  function renderWall(origin = null, focusIndex = null) {
    index = -1;
    part('wall-screen').hidden = false;
    part('viewer').hidden = true;
    dialog.setAttribute('aria-label', album.title + ' 사진 모음');
    const start = pageStart();
    wall.replaceChildren(...album.photos.slice(start, start + pageSize).map((item, i) => print(item, start + i)));
    rig.classList.toggle('pg-wide-row', wall.childElementCount === 3 || wall.childElementCount === 4);
    rig.style.setProperty('--row-columns', wall.childElementCount);
    rig.scrollLeft = 0;
    part('page-count').textContent = String(page + 1).padStart(2, '0') + ' / ' + String(pages()).padStart(2, '0');
    part('pager').hidden = pages() < 2;
    part('prev-page').disabled = page === 0;
    part('next-page').disabled = page === pages() - 1;
    placeCards(origin);
    if (focusIndex !== null) {
      const card = wall.children[focusIndex - start];
      card?.focus({preventScroll:true});
      if (rowOverflows()) card?.scrollIntoView({block:'nearest', inline:'nearest'});
    }
  }
  function open(candidate, trigger) {
    if (dialog.open || !candidate?.photos?.length) return false;
    album = {...candidate, title: trigger?.dataset.galleryTitle || candidate.title};
    part('wall-title').textContent = album.title;
    opener = trigger;
    pageSize = desiredPageSize();
    page = 0;
    index = -1;
    ignoreClicksUntil = 0;
    const rect = trigger?.getBoundingClientRect();
    const origin = rect ? {x:rect.left + rect.width / 2, y:rect.top + rect.height / 2} : null;
    dialog.classList.toggle('pg-single', !!album.detailOnly);
    part('back-label').textContent = album.detailOnly ? '닫기' : '모아보기';
    part('back').firstElementChild.textContent = album.detailOnly ? '×' : '‹';
    dialog.showModal();
    if (album.detailOnly) showPhoto(0, true);
    else {
      renderWall(origin);
      part('close').focus({preventScroll:true});
    }
    onChange();
    return true;
  }
  function finishClose(restore) {
    const trigger = opener;
    opener = null;
    album = null;
    index = -1;
    touch = null;
    cancelAnimationFrame(resizeFrame);
    wall.replaceChildren();
    ropes.replaceChildren();
    detail.removeAttribute('src');
    if (restore && trigger?.isConnected) trigger.focus({preventScroll:true});
    onChange();
  }
  function close(restore = true) {
    if (!dialog.open) return;
    if (!restore) opener = null;
    dialog.close();
    if (album) finishClose(restore);
  }
  function showPhoto(nextIndex, first = false) {
    if (nextIndex < 0 || nextIndex >= album.photos.length) return;
    index = nextIndex;
    page = Math.floor(index / pageSize);
    part('wall-screen').hidden = true;
    part('viewer').hidden = false;
    const photo = album.photos[index];
    detail.src = publishedMedia(photo.src);
    detail.alt = photo.alt || photo.caption;
    part('caption').textContent = photo.caption;
    part('photo-count').textContent = album.detailOnly ? album.title : '사진 ' + (index + 1) + ' / ' + album.photos.length;
    dialog.setAttribute('aria-label', album.title + ' · 사진 크게 보기');
    part('prev-photo').disabled = index === 0;
    part('next-photo').disabled = index === album.photos.length - 1;
    if (first || document.activeElement?.disabled) part('back').focus({preventScroll:true});
  }
  function move(delta) {
    if (index >= 0) { showPhoto(index + delta); return; }
    if (page + delta < 0 || page + delta >= pages()) return;
    page += delta;
    const rect = wall.getBoundingClientRect();
    renderWall({x:delta > 0 ? rect.right : rect.left, y:rect.top + rect.height / 2}, pageStart());
  }
  function back() {
    if (index < 0 || album.detailOnly) close();
    else renderWall(null, index);
  }
  function handleKey(key) {
    if (!dialog.open) return false;
    if (key === 'Escape' || key === 'Backspace') back();
    else if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(key)) move(1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(key)) move(-1);
    else return false;
    return true;
  }
  part('close').addEventListener('click', () => close());
  part('back').addEventListener('click', back);
  for (const [name, delta] of [['prev-page', -1], ['next-page', 1], ['prev-photo', -1], ['next-photo', 1]]) {
    part(name).addEventListener('click', () => move(delta));

  dialog.addEventListener('close', () => {
    // A queued native close can arrive after the next open.
    if (!dialog.open && album) finishClose(true);
  });
  const emptySurfaces = [dialog, wall, part('wall-screen'), part('viewer'), part('view-main'), part('mat')];
  dialog.addEventListener('click', event => {
    if (performance.now() < ignoreClicksUntil) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (emptySurfaces.includes(event.target)) back();
  }, true);
  dialog.addEventListener('touchstart', event => {
    // 스크롤할 수 있는 사진줄에서는 브라우저가 스와이프로 같은 줄을 이동한다.
    const panningRow = rig.contains(event.target) && rowOverflows();
    touch = !panningRow && event.touches.length === 1 ? {x:event.touches[0].clientX, y:event.touches[0].clientY} : null;
  }, {passive:true});

  dialog.addEventListener('touchend', event => {
    if (!touch || !event.changedTouches.length) return;
    const dx = event.changedTouches[0].clientX - touch.x, dy = event.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {

    cancelAnimationFrame(resizeFrame);
    if (!dialog.open) return;
    resizeFrame = requestAnimationFrame(() => {
      if (!dialog.open) return;
      const nextSize = desiredPageSize();
      if (nextSize === pageSize) { if (index < 0) placeCards(); return; }
      const card = document.activeElement?.closest('.pg-print');
      const anchor = index >= 0 ? index : card ? Number(card.dataset.index) : pageStart();
      pageSize = nextSize;
      page = Math.floor(anchor / pageSize);
      if (index < 0) renderWall(null, card ? anchor : null);
    });
  });
  return { open, close, handleKey, get active() { return dialog.open; } };
}

/* ===== 진행 엔진 — 모션 템플릿의 엔진 구조(무대 맞춤·순차 등장·확대 전환·근거 서랍·쪽 목록·정적 모드)를
   여러 장면 + 단계 공개 + 영상 장면 + 발표자 창·타이머로 넓힌 것 (대본·메모·인쇄 대본은 11. 10. 삭제) ===== */
'use strict';
(() => {
const $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];

const fmt = t => { const a = Math.abs(Math.round(t)); return (t < 0 ? '-' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); };
const chName = s => (CH[s.ch].no ? CH[s.ch].no + ' · ' : '') + CH[s.ch].name;

const stage = $('#stage');
const film = createFilmPlayer(stage, ST);

/* 무대 맞춤 */
const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
addEventListener('resize', fit); fit();

/* 장면 만들기 */
const PG = SLIDES.map((s, i) => {

/* 성장 카드 원본의 좌표를 사용해 발표에서 설명할 입력란과 진단표만 크게 보여 준다. */

/* 화면 장치 */
stage.insertAdjacentHTML('beforeend', `<div id="prog"></div><div id="ctr"></div><div id="scrim"></div><aside id="drawer"></aside>

<div id="card-modal" hidden role="dialog" aria-modal="true" aria-labelledby="card-modal-title"><div class="card-modal-panel">

      ${cardDetail('533 645 234 83', '통번역사 필요 여부 선택란')}
    </div></section>

      ${cardDetail('42 1254 495 318', '다문화 수용성, 자기주도적 학습역량, 글로컬 시민성, 주도적 적응력과 종합 평균의 4월 사전·10월 사후 점수 및 변화 기록표')}

let cardTrigger = null;
function showFullCardForm(showFull) {

  $('#card-modal-detail').hidden = showFull;
